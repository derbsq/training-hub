<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bésko's Training Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1eb;--surf:#ede9e0;--surf2:#e6e0d5;--brd:#d5d0c5;--brd2:#c4bfb5;
  --ink:#1a1a18;--muted:#6b6860;--faint:#a8a39c;
  --swim:#1a4a2e;--swl:#e8f0e4;--swm:#3a8a5a;
  --dA:#8b3a1a;--dAl:#f5ede8;
  --dB:#1a3060;--dBl:#e8edf5;
  --dC:#5a1a6e;--dCl:#f0e8f5;
  --mob:#5a1a6e;--mobl:#f0e8f5;
  --bth:#1a3060;--bthl:#e8edf5;
  --bdi:#1a4560;--bdil:#e8f0f5;
  --ok:#2d7a3a;--okl:rgba(45,122,58,.08);--okb:rgba(45,122,58,.22);
  --z1:#3a8a5a;
  --sans:'Syne',sans-serif;--mono:'DM Mono',monospace;
  --r:10px;--r2:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;line-height:1.5;padding-bottom:5rem}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,textarea{font:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:780px;margin:0 auto;padding:0 1rem}

/* HEADER */
header{padding:1.4rem 1rem 1rem;max-width:780px;margin:0 auto;border-bottom:2px solid var(--ink)}
.kicker{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
h1{font-size:clamp(1.55rem,5vw,2.3rem);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.h1m{color:var(--muted);font-weight:600}

/* NAV */
nav{position:sticky;top:0;z-index:40;background:rgba(244,241,235,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1.5px solid var(--brd)}
.tabs{display:flex;gap:.2rem;max-width:780px;margin:0 auto;padding:.5rem .75rem;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;color:var(--muted);border:1.5px solid transparent;border-radius:999px;padding:.42rem .85rem;white-space:nowrap;transition:all .14s}
.tab:active{transform:scale(.95)}
.tab.on{color:var(--bg);font-weight:700}
.tab[data-tab=dash].on{background:var(--ink)}
.tab[data-tab=badi].on{background:var(--bdi)}
.tab[data-tab=swim].on{background:var(--swim)}
.tab[data-tab=dry].on{background:var(--dA)}
.tab[data-tab=log].on{background:var(--ink)}

/* VIEWS */
main{padding-top:1.2rem}
.view{display:none;animation:vu .2s ease}
.view.on{display:block}
@keyframes vu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* SUB-TABS */
.subtabs{display:flex;gap:.22rem;overflow-x:auto;scrollbar-width:none;margin-bottom:1rem}
.subtabs::-webkit-scrollbar{display:none}
.stab{flex:0 0 auto;font-family:var(--mono);font-size:.67rem;letter-spacing:.05em;color:var(--muted);border:1.5px solid var(--brd);border-radius:999px;padding:.38rem .82rem;white-space:nowrap;transition:all .14s}
.stab:active{transform:scale(.95)}
.stab.on{border-color:transparent;color:var(--bg);font-weight:700}
.stab.sa.on{background:var(--dA)} .stab.sb.on{background:var(--dB)} .stab.sc.on{background:var(--dC)}
.stab.sm.on{background:var(--mob)} .stab.sbw.on{background:var(--bth)}
.subview{display:none} .subview.on{display:block}

/* TYPE */
.sec-label{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:1.5rem 0 .6rem;padding-top:.1rem}
.sec-label:first-child{margin-top:0}
.lead{font-size:.84rem;color:var(--muted);font-family:var(--mono);margin-bottom:.85rem;line-height:1.55}

/* BADGE */
.badge{font-family:var(--mono);font-size:.6rem;letter-spacing:.07em;padding:.22rem .55rem;border-radius:999px;border:1.5px solid;flex-shrink:0;white-space:nowrap;display:inline-flex;align-items:center}
.bsw{color:var(--swim);border-color:rgba(26,74,46,.3);background:var(--swl)}
.bz1{color:var(--z1);border-color:rgba(58,138,90,.3);background:var(--swl)}
.bdA{color:var(--dA);border-color:rgba(139,58,26,.3);background:var(--dAl)}
.bdB{color:var(--dB);border-color:rgba(26,48,96,.3);background:var(--dBl)}
.bdC{color:var(--dC);border-color:rgba(90,26,110,.3);background:var(--dCl)}
.bmo{color:var(--mob);border-color:rgba(90,26,110,.3);background:var(--mobl)}
.bbw{color:var(--bth);border-color:rgba(26,48,96,.3);background:var(--bthl)}

/* CARD */
.card{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);margin-bottom:.6rem;overflow:hidden}
.card.logged{background:var(--okl);border-color:var(--okb)}
.card-swim{border-left:3px solid var(--swim)} .card-z1{border-left:3px solid var(--z1)}
.card-dA{border-left:3px solid var(--dA)} .card-dB{border-left:3px solid var(--dB)} .card-dC{border-left:3px solid var(--dC)}
.card-mob{border-left:3px solid var(--mob)} .card-bth{border-left:3px solid var(--bth)}
.card-head{display:flex;align-items:center;gap:.7rem;padding:.88rem 1rem;cursor:pointer;user-select:none}
.card-head:active{background:var(--surf2)}
.card-title{flex:1;min-width:0}
.card-title .t{font-weight:700;font-size:.94rem;display:block}
.card-title .s{font-family:var(--mono);font-size:.71rem;color:var(--muted);margin-top:.16rem;display:block}
.done-dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex-shrink:0;transition:all .2s}
.card.logged .done-dot{background:var(--ok);box-shadow:0 0 5px rgba(45,122,58,.4)}
.chev{font-size:.72rem;color:var(--faint);transition:transform .2s;flex-shrink:0}
.card.open>.card-head .chev{transform:rotate(90deg)}
.card-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.card.open>.card-body{max-height:none}
.card-inner{padding:.2rem 1rem 1rem}

/* FOCUS CUE */
.focus-cue{background:var(--surf2);border-radius:var(--r);padding:.7rem .85rem;margin-bottom:.8rem;font-size:.82rem}
.cue-lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.22rem;display:block}
.card-swim .cue-lbl,.card-z1 .cue-lbl{color:var(--swim)}
.card-dA .cue-lbl{color:var(--dA)} .card-dB .cue-lbl{color:var(--dB)} .card-dC .cue-lbl{color:var(--dC)}
.card-mob .cue-lbl{color:var(--mob)} .card-bth .cue-lbl{color:var(--bth)}

/* DRILLS */
.drills{display:flex;gap:.38rem;flex-wrap:wrap;margin-bottom:.7rem}
.drl{font-family:var(--mono);font-size:.67rem;color:var(--bth);border-bottom:1px dotted currentColor}
.drt{font-family:var(--mono);font-size:.67rem;color:var(--muted);border:1px solid var(--brd);padding:.13rem .42rem;border-radius:4px}

/* PHASE + ITEMS */
.phase{margin:.8rem 0 .15rem}
.ph-name{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:.42rem;padding-bottom:.36rem;border-bottom:1px solid var(--brd)}
.ph-meta{color:var(--faint);font-size:.58rem}
.item{display:flex;gap:.6rem;padding:.46rem 0;border-bottom:1px solid var(--brd)}
.item:last-child{border-bottom:none}
.chk{flex-shrink:0;width:22px;height:22px;border:1.5px solid var(--faint);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;margin-top:.06rem}
.chk:active{transform:scale(.88)} .chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:'✓';color:#fff;font-size:.77rem;font-weight:800}
.it-body{flex:1;min-width:0}
.it-t{font-size:.87rem} .it-t.struck{text-decoration:line-through;color:var(--faint)}
.it-n{font-size:.75rem;color:var(--muted);margin-top:.13rem;font-family:var(--mono);line-height:1.44}

/* EXERCISE (DRYLAND) */
.ex-item{padding:.68rem 0;border-bottom:1px solid var(--brd)}
.ex-item:last-child{border-bottom:none}
.ex-top{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:.32rem}
.ex-name{font-size:.9rem;font-weight:700;flex:1}
.ex-tgt{font-family:var(--mono);font-size:.65rem;padding:.18rem .48rem;border-radius:4px;flex-shrink:0}
.card-dA .ex-tgt{color:var(--dA);background:var(--dAl)} .card-dB .ex-tgt{color:var(--dB);background:var(--dBl)} .card-dC .ex-tgt{color:var(--dC);background:var(--dCl)}
.ex-mus{font-family:var(--mono);font-size:.63rem;color:var(--faint);margin-bottom:.26rem}
.ex-cue{font-size:.78rem;color:var(--muted);font-family:var(--mono);margin-bottom:.42rem;line-height:1.44;padding-left:.8rem;border-left:2px solid var(--brd)}
.ex-in{display:flex;gap:.42rem;flex-wrap:wrap;margin-top:.32rem}
.ff{display:flex;flex-direction:column;gap:.17rem}
.ff label{font-family:var(--mono);font-size:.57rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ff input{background:var(--bg);border:1.5px solid var(--brd);border-radius:7px;color:var(--ink);padding:.36rem .5rem;font-family:var(--mono);font-size:.79rem;transition:border-color .12s;min-width:0}
.ff input:focus{outline:none}
.card-dA .ff input:focus{border-color:var(--dA)} .card-dB .ff input:focus{border-color:var(--dB)} .card-dC .ff input:focus{border-color:var(--dC)}
.ff-r{width:84px} .ff-b{flex:1;min-width:128px}

/* SESSION FOOTER */
.sess-foot{margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--brd)}
.sess-meta{display:flex;gap:.42rem;flex-wrap:wrap;margin-bottom:.58rem}
.sess-meta .ff-rpe{width:70px} .sess-meta .ff-note{flex:1;min-width:150px}
.sess-meta textarea{background:var(--bg);border:1.5px solid var(--brd);border-radius:7px;color:var(--ink);padding:.36rem .5rem;font-family:var(--sans);font-size:.8rem;width:100%;resize:vertical;min-height:34px}
.sess-meta textarea:focus{outline:none;border-color:var(--swim)}
.sess-btns{display:flex;gap:.42rem}
.btn{flex:1;border-radius:var(--r);padding:.63rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;font-weight:700;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-sw{background:var(--swim);color:#fff} .btn-dA{background:var(--dA);color:#fff} .btn-dB{background:var(--dB);color:#fff} .btn-dC{background:var(--dC);color:#fff} .btn-mo{background:var(--mob);color:#fff} .btn-bw{background:var(--bth);color:#fff}
.btn-rst{background:var(--surf2);color:var(--muted);border:1.5px solid var(--brd);flex:0 0 auto;padding:.63rem 1rem}
.sav{font-family:var(--mono);font-size:.67rem;color:var(--ok);margin-top:.36rem;display:none}
.sav.show{display:block}

/* CALENDAR (IMPROVED) */
.cal-wrap{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:1rem 1rem .75rem;margin-top:.2rem;margin-bottom:1rem}
.cal-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.7rem}
.cal-ml{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cal-tl{font-size:.82rem;font-weight:700;color:var(--swim)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-family:var(--mono);font-size:.57rem;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:center;padding-bottom:.3rem}
.cal-day{min-height:52px;display:flex;flex-direction:column;padding:3px;border-radius:7px;position:relative;cursor:default}
.cal-day.has-s{cursor:pointer}
.cal-day.has-s:active{background:var(--surf2)}
.cal-dn{font-family:var(--mono);font-size:.67rem;color:var(--muted);margin-bottom:2px;padding-left:2px}
.cal-day.has-s .cal-dn{color:var(--ink);font-weight:600}
.cal-day.today .cal-dn{color:var(--swim);font-weight:800}
.cal-day.today::before{content:'';position:absolute;top:1px;left:1px;right:1px;bottom:1px;border:2px solid var(--swim);border-radius:6px;pointer-events:none}
.cal-ev{font-family:var(--mono);font-size:.55rem;padding:2px 4px;border-radius:3px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.cal-ev.esw{background:var(--swl);color:var(--swim)} .cal-ev.ez1{background:var(--swl);color:var(--z1)} .cal-ev.edy{background:var(--dAl);color:var(--dA)}

/* PACING */
.pacing-box{background:var(--swl);border:1.5px solid rgba(26,74,46,.18);border-radius:var(--r2);padding:.9rem;margin-bottom:1rem}
.pacing-box h3{font-size:.88rem;font-weight:700;color:var(--swim);margin-bottom:.18rem}
.pacing-note{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-bottom:.62rem}
.pace-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.pcell{background:#fff;border:1.5px solid rgba(26,74,46,.14);border-radius:7px;padding:.4rem .28rem;text-align:center}
.pcell.hot{border-color:var(--swim)}
.pz{font-family:var(--mono);font-size:.56rem;color:var(--muted);text-transform:uppercase}
.pv{font-family:var(--mono);font-size:.88rem;font-weight:600;margin-top:.1rem}
.pcell.hot .pv{color:var(--swim)}

/* BADI */
.badi-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-bottom:.85rem}
@media(min-width:520px){.badi-stat-grid{grid-template-columns:repeat(4,1fr)}}
.badi-cell{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.65rem .8rem}
.badi-cell-name{font-size:.77rem;font-weight:700;margin-bottom:.28rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badi-bar-bg{height:5px;background:var(--brd);border-radius:3px;overflow:hidden;margin-bottom:.22rem}
.badi-bar{height:100%;border-radius:3px;transition:width .5s}
.badi-pct{font-family:var(--mono);font-size:.64rem;color:var(--muted);margin-bottom:.18rem}
.badi-status{font-family:var(--mono);font-size:.61rem;font-weight:700}
.bst-g{color:var(--ok)} .bst-y{color:#b07a00} .bst-r{color:var(--dA)}
.badi-ts{font-family:var(--mono);font-size:.59rem;color:var(--faint);text-align:center;margin:0 0 1rem;padding:.45rem 0;border-top:1px solid var(--brd)}

/* HEATMAP */
.hm-wrap{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.9rem;margin-bottom:.9rem;overflow-x:auto}
.hm-title{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.65rem}
.hm-select{display:flex;gap:.28rem;flex-wrap:wrap;margin-bottom:.7rem}
.hm-pill{font-family:var(--mono);font-size:.62rem;padding:.22rem .62rem;border-radius:999px;border:1.5px solid var(--brd);color:var(--muted);cursor:pointer}
.hm-pill.on{background:var(--bdi);color:#fff;border-color:var(--bdi)}
.hm-grid{display:grid;gap:2px;min-width:340px}
.hm-cell{height:18px;border-radius:2px}
.hm-lbl{font-family:var(--mono);font-size:.56rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.hm-legend{display:flex;align-items:center;gap:.5rem;margin-top:.55rem}
.hm-leg-bar{display:flex;gap:2px;flex:1}
.hm-leg-cell{flex:1;height:8px;border-radius:2px}
.hm-leg-lbl{font-family:var(--mono);font-size:.57rem;color:var(--muted)}

/* ORACLE */
.oracle-wrap{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.9rem;margin-bottom:.9rem}
.oracle-title{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}
.oracle-name{font-size:.85rem;font-weight:700;margin-bottom:.5rem;color:var(--bdi)}
.oracle-grid{display:flex;gap:.4rem;flex-wrap:wrap}
.oracle-slot{background:var(--bg);border:1.5px solid var(--brd);border-radius:var(--r);padding:.5rem .65rem;min-width:60px;text-align:center}
.oracle-slot.best{border-color:var(--ok);background:var(--okl)}
.oracle-h{font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-bottom:.2rem}
.oracle-p{font-family:var(--mono);font-size:.95rem;font-weight:700}
.oracle-tip{font-family:var(--mono);font-size:.58rem;color:var(--ok);margin-top:.2rem}
.oracle-best{font-family:var(--mono);font-size:.72rem;color:var(--ok);margin-top:.55rem}

/* BADI FULL HEADER */
.badi-hero{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:1rem;margin-bottom:.75rem;display:flex;justify-content:space-between;align-items:center;gap:.75rem}
.badi-hero-txt h2{font-size:.98rem;font-weight:800;color:var(--bdi);margin-bottom:.2rem}
.badi-hero-txt p{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.badi-ref-btn{display:inline-block;background:var(--bdi);color:#fff;font-family:var(--mono);font-size:.65rem;padding:.52rem 1rem;border-radius:999px;font-weight:700;flex-shrink:0}

/* WEEK DASHBOARD */
.wk-day{margin-bottom:.3rem}
.wk-date{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:.85rem 0 .4rem}
.wk-date:first-child{margin-top:0}
.wk-date.wk-today{color:var(--swim);font-weight:700}

/* MOBILITY CARDS */
.mob-card{background:var(--surf);border:1.5px solid var(--brd);border-left:3px solid var(--mob);border-radius:var(--r2);padding:.88rem 1rem;margin-bottom:.55rem;transition:background .15s,border-color .15s}
.mob-card.mc-done{background:var(--okl);border-color:var(--okb)}
.mob-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.42rem}
.mob-name{font-size:.9rem;font-weight:700;flex:1}
.mob-reps{font-family:var(--mono);font-size:.66rem;color:var(--mob);background:var(--mobl);padding:.17rem .48rem;border-radius:4px;flex-shrink:0}
.mob-mus{font-family:var(--mono);font-size:.62rem;color:var(--faint);margin-bottom:.28rem}
.mob-note{font-size:.8rem;color:var(--muted);line-height:1.5}
.mob-chk{width:24px;height:24px;border:1.5px solid var(--faint);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .12s}
.mob-chk:active{transform:scale(.9)} .mob-chk.on{background:var(--ok);border-color:var(--ok)}
.mob-chk.on::after{content:'✓';color:#fff;font-size:.82rem;font-weight:800}

/* BREATHWORK */
.bw-btns{display:flex;gap:.42rem;margin-top:.75rem}
.bw-visual{display:flex;flex-direction:column;align-items:center;padding:.7rem 0}
.bw-circle{width:120px;height:120px;border-radius:50%;border:2px solid var(--bth);background:radial-gradient(circle at 50% 40%,rgba(26,48,96,.1),transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 1s ease;transform:scale(.62)}
.bw-phase{font-family:var(--mono);font-size:.8rem;color:var(--bth);text-align:center}
.bw-count{font-family:var(--mono);font-size:1.75rem;font-weight:700;margin-top:.65rem;min-width:3rem;text-align:center}
.bw-rnd{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-top:.18rem}

/* LOG */
.hist-e{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.8rem 1rem;margin-bottom:.5rem}
.he-hd{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.28rem}
.he-t{font-weight:700;font-size:.87rem} .he-d{font-family:var(--mono);font-size:.66rem;color:var(--muted);flex-shrink:0}
.he-s{font-family:var(--mono);font-size:.72rem;color:var(--muted);line-height:1.55;white-space:pre-wrap}
.pb-e{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.78rem 1rem;margin-bottom:.5rem}
.pb-n{font-weight:700;font-size:.87rem;margin-bottom:.18rem}

async function loadBadi(){
  if(badiLoaded||badiLoading)return;
  badiLoading=true;
  try{
    const res=await fetch('https://raw.githubusercontent.com/derbsq/Badi-Tracker/main/data/occupancy.csv');
    if(!res.ok)throw new Error('fetch failed');
    const txt=await res.text();
    const lines=txt.trim().split('\n');
    if(lines.length<2){badiLoading=false;return;}
    const hdr=lines[0].split(',').map(h=>h.trim().toLowerCase());
    const tC=hdr.findIndex(h=>h.includes('time')||h.includes('ts'));
    const nC=hdr.findIndex(h=>h.includes('badi')||h.includes('name')||h.includes('facility'));
    const pC=hdr.findIndex(h=>h.includes('pct')||h.includes('percent')||h.includes('load'));
    const cC=hdr.findIndex(h=>h.includes('current')||h.includes('count')||h.includes('abs'));
    const mC=hdr.findIndex(h=>h.includes('max')||h.includes('capacity'));
    badiRows=[];
    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(',').map(c=>c.trim());
      if(cols.length<2)continue;
      const tsStr=tC>=0?cols[tC]:'';const name=nC>=0?cols[nC]:'';
      let pct=pC>=0?parseFloat(cols[pC]):NaN;
      if(isNaN(pct)&&cC>=0&&mC>=0){const c2=parseFloat(cols[cC]),m2=parseFloat(cols[mC]);if(!isNaN(c2)&&!isNaN(m2)&&m2>0)pct=Math.round(c2/m2*100);}
      if(!tsStr||!name||isNaN(pct))continue;
      const ts=new Date(tsStr);if(isNaN(ts.getTime()))continue;
      const ageDays=(Date.now()-ts.getTime())/(86400000);
      badiRows.push({ts,name,pct:Math.round(pct),dow:(ts.getDay()+6)%7,hour:ts.getHours(),ageDays});
    }
    badiLoaded=true;
  }catch(err){}
  badiLoading=false;
  renderBadiViews();
}

function getCurrentStatus(){
  const latest={};const cutoff=Date.now()-30*60000;
  badiRows.forEach(r=>{if(r.ts.getTime()<cutoff)return;if(!latest[r.name]||r.ts>latest[r.name].ts)latest[r.name]=r;});
  return latest;
}

function buildHeatmap(facility){
  // 7 days × 16 hours (5:00-20:00)
  const grid=Array.from({length:7},()=>Array.from({length:16},()=>({sum:0,cnt:0})));
  badiRows.forEach(r=>{
    const nl=r.name.toLowerCase(),fl=facility.toLowerCase();
    if(!nl.includes(fl.split(' ')[0].toLowerCase())&&!fl.includes(nl.split(' ')[0].toLowerCase()))return;
    const h=r.hour-5;if(h<0||h>=16)return;
    grid[r.dow][h].sum+=r.pct;grid[r.dow][h].cnt++;
  });
  return grid.map(row=>row.map(c=>c.cnt>0?Math.round(c.sum/c.cnt):null));
}

function getOracle(facility){
  const now=new Date();const dow=(now.getDay()+6)%7;const hr=now.getHours();
  const preds=[];
  for(let dh=0;dh<8;dh++){
    const th=(hr+dh)%24;const td2=dh>=(24-hr)?((dow+1)%7):dow;
    const similar=badiRows.filter(r=>{
      const nl=r.name.toLowerCase(),fl=facility.toLowerCase();
      if(!nl.includes(fl.split(' ')[0].toLowerCase())&&!fl.includes(nl.split(' ')[0].toLowerCase()))return false;
      return r.dow===td2&&Math.abs(r.hour-th)<=1;
    });
    if(!similar.length){preds.push({h:th,pct:null});continue;}
    let sw=0,sp=0;
    similar.forEach(r=>{const w=Math.exp(-0.023*r.ageDays);sw+=w;sp+=w*r.pct;});
    preds.push({h:th,pct:Math.round(sp/sw)});
  }
  return preds;
}

function renderHeatmapHtml(facility){
  if(!badiLoaded)return`<div class="loading">Daten werden geladen…</div>`;
  const grid=buildHeatmap(facility);
  const days=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const hours=Array.from({length:16},(_,i)=>i+5);
  const now=new Date();const todayDow=(now.getDay()+6)%7;const curH=now.getHours();
  const cols=`30px repeat(16,1fr)`;
  let h=`<div class="hm-grid" style="display:grid;grid-template-columns:${cols};gap:2px;">`;
  // header row
  h+=`<div class="hm-lbl"></div>`;
  hours.forEach(hr=>{const isCur=(hr===curH);h+=`<div class="hm-lbl" style="${isCur?'color:var(--swim);font-weight:700':''}">${hr}</div>`;});
  // day rows
  days.forEach((d,di)=>{
    const isToday=di===todayDow;
    h+=`<div class="hm-lbl" style="${isToday?'color:var(--swim);font-weight:700':''}">${d}</div>`;
    hours.forEach((_,hi)=>{
      const val=grid[di][hi];const c=pctColor(val);const op=val!==null?1:0.25;const isCur=isToday&&hours[hi]===curH;
      h+=`<div class="hm-cell" style="background:${c};opacity:${op};${isCur?'box-shadow:0 0 0 2px var(--swim)':''}" title="${val!==null?val+'%':'–'}"></div>`;
    });
  });
  h+='</div>';
  // legend
  h+=`<div class="hm-legend"><span class="hm-leg-lbl">Leer</span><div class="hm-leg-bar">${[0,20,35,52,68,80,93].map(p=>`<div class="hm-leg-cell" style="background:${pctColor(p)}"></div>`).join('')}</div><span class="hm-leg-lbl">Voll</span></div>`;
  return h;
}

function renderOracleHtml(facility){
  if(!badiLoaded)return`<div class="loading">Daten werden geladen…</div>`;
  const preds=getOracle(facility);
  const best=preds.reduce((a,b)=>(b.pct!==null&&(a===null||b.pct<a.pct))?b:a,null);
  const slots=preds.map(p=>{
    const isBest=best&&p.h===best.h&&p.pct!==null;
    const [,scls]=statusLabel(p.pct);
    return`<div class="oracle-slot${isBest?' best':''}"><div class="oracle-h">${String(p.h).padStart(2,'0')}:00</div><div class="oracle-p" style="color:${pctColor(p.pct)}">${p.pct!==null?p.pct+'%':'–'}</div>${isBest?'<div class="oracle-tip">beste Zeit</div>':''}</div>`;
  }).join('');
  const bestTxt=best&&best.pct!==null?`→ Beste Zeit heute ca. ${String(best.h).padStart(2,'0')}:00 Uhr (~${best.pct}% erwartet)`:'';
  return`<div class="oracle-name">${e(BADI_SHORT[facility]||facility)}</div><div class="oracle-grid">${slots}</div>${bestTxt?`<div class="oracle-best">${e(bestTxt)}</div>`:''}`;
}

function viewDash(){
  const td=today();
  const now=new Date();const dowNow=(now.getDay()+6)%7;
  const weekDates=Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(now.getDate()-dowNow+i);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;});
  const dayNames=['Mo','Di','Mi','Do','Fr','Sa','So'];
  
  let h='';
  let hasAny=false;
  weekDates.forEach((ds,di)=>{
    const sessions=SCHED[ds]||[];
    if(!sessions.length)return;
    hasAny=true;
    const isToday=ds===td;
    const d=new Date(ds);
    const lbl=`${dayNames[di]} ${d.getDate()}.${d.getMonth()+1}.`;
    h+=`<div class="wk-date${isToday?' wk-today':''}">${lbl}${isToday?' · Heute':''}</div>`;

      const sType=sess.type;
      const sData=sType==='swim'?SWIM.find(x=>x.id===sess.id):DRYLAND.find(x=>x.id===sess.id);
      if(!sData)return;
      const key=sType+':'+sess.id;
      const logged=!!STATE.done[key];
      const acc=sType==='swim'?(sData.z1?'z1':'swim'):`d${sess.id}`;
      const bc=sType==='swim'?sData.bc:sData.bc;
      const drills=sType==='swim'&&sData.drills?.map(d=>d.u?`<a class="drl" href="${e(d.u)}" target="_blank" rel="noopener">▶ ${e(d.n)}</a>`:`<span class="drt">${e(d.n)}</span>`).join('')||'';
      const btnC=sType==='swim'?'btn-sw':sData.btn;
      const foot=renderFoot(key,btnC,sData.badge+' – '+sData.title);
      const phases=renderPhases(key,sData.phases,sType==='dry');
      const focus=sData.focus||sData.cue?`<div class="focus-cue"><span class="cue-lbl">${e(sData.cue)}</span>${e(sData.focus||'')}</div>`:'';
      h+=`<div class="card card-${sType==='swim'?(sData.z1?'z1':'swim'):`${sData.acc}`}${logged?' logged':''}" data-card="${e(key)}">
        <div class="card-head" data-toggle="${e(key)}"><span class="done-dot"></span><span class="badge ${bc}">${e(sData.badge)}</span><span class="card-title"><span class="t">${e(sData.title)}</span><span class="s">${e(sData.sub)}</span></span><span class="chev">▶</span></div>
        <div class="card-body"><div class="card-inner">${focus}${drills?`<div class="drills">${drills}</div>`:''}${phases}${foot}</div></div>

  qs('#v-dash').innerHTML=h;
}

function viewLog(){
  const el=qs('#v-log');
  let h=`<div class="sec-label">Session-Verlauf</div>`;
  if(!STATE.history.length){h+=`<div class="empty">Noch keine Sessions geloggt.</div>`;}
  else{[...STATE.history].reverse().forEach(e2=>{h+=`<div class="hist-e"><div class="he-hd"><span class="he-t">${e(e2.title)}</span><span class="he-d">${e(e2.date)}</span></div><div class="he-s">${e(e2.summary)}</div></div>`;});}
  h+=`<div class="sec-label">Dryland-Progression</div>`;
  const pkeys=Object.keys(STATE.progress);
  if(!pkeys.length){h+=`<div class="empty">Noch keine Dryland-Reps geloggt.</div>`;}
  else{pkeys.forEach(id=>{const arr=STATE.progress[id];if(!arr?.length)return;const last=arr[arr.length-1];const nm=findExName(id)||id;const nums=arr.map(x=>parseInt(x.reps)||0).filter(n=>n>0);h+=`<div class="pb-e"><div class="pb-n">${e(nm)}</div><div class="pb-d">Zuletzt: ${e(last.reps||'–')}${last.band?' · '+e(last.band):''} · ${e(last.date)} · ${arr.length} Einträge</div>${sparkline(nums)}</div>`;});}
  el.innerHTML=h;
}

function findExName(id){for(const s of DRYLAND)for(const p of s.phases)for(const it of p.items)if(it.ex&&it.id===id)return it.name;return null;}
function sparkline(nums){if(nums.length<2)return'';const w=120,hh=28,mn=Math.min(...nums),mx=Math.max(...nums),rng=(mx-mn)||1;const pts=nums.map((n,k)=>{const x=(k/(nums.length-1))*(w-4)+2;const y=hh-2-((n-mn)/rng)*(hh-4);return`${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');return`<svg class="spark" width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}"><polyline points="${pts}" fill="none" stroke="var(--swim)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;}

/* ===== LOGGING ===== */
function flashSav(key){const el=qs(`[data-sav="${CE(key)}"]`);if(!el)return;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400);}
function logSession(key,title){
  const[type,id]=key.split(':');
  let summary='';
  if(type==='dry'){
    const s=DRYLAND.find(d=>d.id===id);
    if(s){const lines=[];s.phases.forEach(p=>p.items.forEach(it=>{if(it.ex){const reps=STATE.inputs[it.id+'_r']||'';const band=STATE.inputs[it.id+'_b']||'';if(reps||band){lines.push(`• ${it.name}: ${reps||'–'}${band?' · '+band:''}`);STATE.progress[it.id]=STATE.progress[it.id]||[];STATE.progress[it.id].push({date:todayFmt(),reps,band});}}}));summary=lines.join('\n');}
  }
  const rpe=STATE.inputs[key+'_rpe'];const note=STATE.inputs[key+'_note'];
  if(rpe)summary+=(summary?'\n':'')+'RPE '+rpe;
  if(note)summary+=(summary?'\n':'')+'„'+note+'"';
  STATE.history.push({key,date:todayFmt(),ts:Date.now(),title,summary:summary||'–'});
  STATE.done[key]=true;persist();
  const card=qs(`[data-card="${CE(key)}"]`);if(card){card.classList.add('logged');const dot=card.querySelector('.done-dot');if(dot)dot.style.background='var(--ok)';}
  flashSav(key);
  rendered.log=false;rendered.dash=false;
}

/* ===== BREATHWORK TIMER ===== */
let bwT=null;
function stopBW(){if(bwT){clearTimeout(bwT);bwT=null;}}
function startBW(id){
  stopBW();const b=BREATH.find(x=>x.id===id);if(!b)return;
  let round=1,pi=0;
  function run(){
    const p=b.pattern[pi];
    const phEl=qs(`#bwph-${id}`),ctEl=qs(`#bwct-${id}`),rnEl=qs(`#bwrn-${id}`),ciEl=qs(`#bwc-${id}`);
    if(!phEl)return;
    phEl.textContent=p.label;
    if(ciEl){const sc=/ein/i.test(p.label)?'scale(1)':/aus/i.test(p.label)?'scale(.58)':null;if(sc){ciEl.style.transitionDuration=p.sec+'s';ciEl.style.transform=sc;}}
    if(rnEl)rnEl.textContent=`Runde ${round} / ${b.rounds}`;
    let left=p.sec;if(ctEl)ctEl.textContent=left;
    function tick(){left--;if(ctEl)ctEl.textContent=Math.max(left,0);
      if(left<=0){pi++;if(pi>=b.pattern.length){pi=0;round++;if(round>b.rounds){if(phEl)phEl.textContent='Fertig ✓';if(ctEl)ctEl.textContent='';stopBW();return;}}run();return;}
      bwT=setTimeout(tick,1000);}
    bwT=setTimeout(tick,1000);
  }
  run();
}

/* ===== SHOW / TABS ===== */
const rendered={};
function show(tabName,scrollId){
  stopBW();
  qsa('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tabName));
  qsa('.view').forEach(v=>v.classList.toggle('on',v.dataset.view===tabName));
  const needRefresh=['dash','log'];
  if(needRefresh.includes(tabName)||!rendered[tabName]){
    if(tabName==='dash')viewDash();
    else if(tabName==='swim')viewSwim();
    else if(tabName==='dry')viewDry();
    else if(tabName==='badi'){renderBadiTab();if(!badiLoaded&&!badiLoading)loadBadi();}
    else if(tabName==='log')viewLog();
    rendered[tabName]=true;
  }
  window.scrollTo({top:0,behavior:'auto'});
  if(scrollId){
    setTimeout(()=>{
      const card=qs(`[data-card="${CE(tabName+':'+scrollId)}"]`);
      if(!card)return;
      card.classList.add('open');
      const nav=qs('nav');const navH=nav?nav.offsetHeight:55;
      const top=card.getBoundingClientRect().top+window.scrollY-navH-10;
      window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
    },90);
  }
}

function showSub(subId){
  qsa('.stab').forEach(t=>t.classList.toggle('on',t.dataset.sub===subId));
  qsa('.subview').forEach(v=>v.classList.toggle('on',v.id===`sv-${subId}`));
}

/* ===== EVENTS ===== */
document.addEventListener('click',ev=>{
  // Main tabs
  const tab=ev.target.closest('.tab');if(tab){show(tab.dataset.tab);return;}
  // Sub-tabs
  const stab=ev.target.closest('.stab');if(stab){showSub(stab.dataset.sub);return;}
  // Card toggle
  const tog=ev.target.closest('[data-toggle]');
  if(tog){
    const k=tog.dataset.toggle;
    // Handle special (non-data-card) toggles
    if(k==='hb-info'){const bd=qs('#hb-info-body');if(bd)bd.style.maxHeight=bd.style.maxHeight?'':'none';const c=tog.querySelector('.chev');if(c)c.style.transform=c.style.transform?'':'rotate(90deg)';return;}
    const card=qs(`[data-card="${CE(k)}"]`);if(card)card.classList.toggle('open');return;
  }
  // Calendar day click
  const cday=ev.target.closest('[data-cday]');
  if(cday){
    const ds=cday.dataset.cday;const csid=ev.target.dataset.csid;const ctype=ev.target.dataset.ctype;
    if(csid&&ctype){show(ctype==='dry'?'dry':'swim',csid);}
    else{const sess=SCHED[ds]||[];if(sess.length){const s=sess[0];show(s.type==='dry'?'dry':'swim',s.id);}}
    return;
  }
  // Dashboard week row
  const wrow=ev.target.closest('[data-goto-tab]');if(wrow){show(wrow.dataset.gotoTab,wrow.dataset.gotoId);return;}
  // Log session
  const lb=ev.target.closest('[data-log]');if(lb){logSession(lb.dataset.log,lb.dataset.title||lb.dataset.log);return;}
  // Reset session
  const rb=ev.target.closest('[data-reset]');
  if(rb){
    const key=rb.dataset.reset;const id=key.split(':')[1];
    // Reset dryland exercise checks
    if(key.startsWith('dry:')){DRYLAND.find(d=>d.id===id)?.phases.forEach(p=>p.items.forEach(it=>{if(it.ex){delete STATE.checks[it.id];const el=qs(`[data-exchk="${CE(it.id)}"]`);if(el){el.classList.remove('on');const nm=el.parentNode.querySelector('.ex-name');if(nm)nm.classList.remove('struck');}}}));}
    persist();return;
  }
  // Exercise checkbox
  const xc=ev.target.closest('[data-exchk]');
  if(xc){const rk=xc.dataset.exchk;STATE.checks[rk]=!STATE.checks[rk];persist();xc.classList.toggle('on',STATE.checks[rk]);const nm=xc.parentNode.querySelector('.ex-name');if(nm)nm.classList.toggle('struck',STATE.checks[rk]);return;}
  // Mobility checkbox
  const mc=ev.target.closest('[data-mobchk]');
  if(mc){const mk=mc.dataset.mobchk;STATE.checks[mk]=!STATE.checks[mk];persist();mc.classList.toggle('on',STATE.checks[mk]);const cd=mc.closest('.mob-card');if(cd)cd.classList.toggle('mc-done',STATE.checks[mk]);return;}
  // Breathwork
  const bwS=ev.target.closest('[data-bwstart]');if(bwS){startBW(bwS.dataset.bwstart);return;}
  const bwSt=ev.target.closest('[data-bwstop]');if(bwSt){stopBW();return;}
  // Badi facility selector
  const bds=ev.target.closest('[data-bdsel]');if(bds){selectedBadi=bds.dataset.bdsel;qsa('.hm-pill').forEach(p=>p.classList.toggle('on',p.dataset.bdsel===selectedBadi));const hg=qs('#hm-grid-wrap');if(hg)hg.innerHTML=renderHeatmapHtml(selectedBadi);const og=qs('#oracle-wrap');if(og)og.innerHTML=renderOracleHtml(selectedBadi);return;}
});

document.addEventListener('input',ev=>{
  const si=ev.target.closest('[data-si]');
  if(si){const k=si.dataset.key;STATE.inputs[k+'_'+si.dataset.si]=ev.target.value;persist();return;}
  const ei=ev.target.closest('[data-ei]');
  if(ei){const rk=ei.dataset.rk;STATE.inputs[rk+'_'+ei.dataset.ei]=ev.target.value;persist();}
});

/* ===== INIT ===== */
show('dash');
loadBadi();
setInterval(()=>{if(!badiLoaded)loadBadi();else{badiRows=[];badiLoaded=false;badiLoading=false;loadBadi();}},10*60*1000);

})();
</script>
</body>
</html>
