<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bésko's Little Training Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1eb;--surf:#ede9e0;--surf2:#e5dfd4;--brd:#d5d0c5;--brd2:#c2bdb2;
  --ink:#1a1a18;--muted:#6b6860;--faint:#aaa49d;
  --swim:#1a4a2e;--swl:#e8f0e4;--swm:#3a8a5a;
  --dA:#8b3a1a;--dAl:#f5ede8; --dB:#1a3060;--dBl:#e8edf5; --dC:#5a1a6e;--dCl:#f0e8f5;
  --mob:#5a1a6e;--mobl:#f0e8f5; --bth:#1a3060;--bthl:#e8edf5;
  --bdi:#1a4560;--bdil:#e8f0f5;
  --ok:#2d7a3a;--okl:rgba(45,122,58,.08);--okb:rgba(45,122,58,.22);
  --z1:#3a8a5a;
  --sans:'Syne',sans-serif;--mono:'DM Mono',monospace;
  --r:10px;--r2:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;line-height:1.5;padding-bottom:5rem}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,textarea{font:inherit} a{color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:0 1.25rem}

/* HEADER */
header{padding:2rem 1.25rem 1.25rem;max-width:780px;margin:0 auto;border-bottom:2px solid var(--ink)}
h1{font-size:clamp(1.7rem,5.5vw,2.6rem);font-weight:800;letter-spacing:-.025em;line-height:1.1}
.h1m{color:var(--muted);font-weight:600}

/* NAV */
nav{position:sticky;top:0;z-index:40;background:rgba(244,241,235,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1.5px solid var(--brd)}
.tabs{display:flex;gap:.22rem;max-width:780px;margin:0 auto;padding:.55rem .75rem;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;color:var(--muted);border:1.5px solid transparent;border-radius:999px;padding:.44rem .9rem;white-space:nowrap;transition:all .14s}
.tab:active{transform:scale(.95)}
.tab.on{color:var(--bg);font-weight:700}
.tab[data-tab=dash].on{background:var(--ink)} .tab[data-tab=badi].on{background:var(--bdi)}
.tab[data-tab=swim].on{background:var(--swim)} .tab[data-tab=dry].on{background:var(--dA)}
.tab[data-tab=method].on{background:var(--dC)} .tab[data-tab=log].on{background:var(--ink)}

/* VIEWS */
main{padding-top:1.4rem}
.view{display:none;animation:vu .2s ease} .view.on{display:block}
@keyframes vu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* SUB-TABS (Dryland) */
.subtabs{display:flex;gap:.22rem;overflow-x:auto;scrollbar-width:none;margin-bottom:1.2rem;padding-bottom:.1rem}
.subtabs::-webkit-scrollbar{display:none}
.stab{flex:0 0 auto;font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;color:var(--muted);border:1.5px solid var(--brd);border-radius:999px;padding:.4rem .82rem;white-space:nowrap;transition:all .14s}
.stab:active{transform:scale(.95)} .stab.on{border-color:transparent;color:var(--bg);font-weight:700}
.stab.sa.on{background:var(--dA)} .stab.sb.on{background:var(--dB)} .stab.sc.on{background:var(--dC)}
.stab.sm.on{background:var(--mob)} .stab.sbw.on{background:var(--bth)}
.subview{display:none} .subview.on{display:block}

/* TYPE */
.sec-label{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:1.6rem 0 .65rem}
.sec-label:first-child{margin-top:.1rem}
.lead{font-size:.84rem;color:var(--muted);font-family:var(--mono);margin-bottom:.9rem;line-height:1.55}

/* BADGE */
.badge{font-family:var(--mono);font-size:.6rem;letter-spacing:.07em;padding:.22rem .55rem;border-radius:999px;border:1.5px solid;flex-shrink:0;white-space:nowrap;display:inline-flex;align-items:center}
.bsw{color:var(--swim);border-color:rgba(26,74,46,.3);background:var(--swl)} .bz1{color:var(--z1);border-color:rgba(58,138,90,.3);background:var(--swl)}
.bdA{color:var(--dA);border-color:rgba(139,58,26,.3);background:var(--dAl)} .bdB{color:var(--dB);border-color:rgba(26,48,96,.3);background:var(--dBl)}
.bdC{color:var(--dC);border-color:rgba(90,26,110,.3);background:var(--dCl)}
.bmo{color:var(--mob);border-color:rgba(90,26,110,.3);background:var(--mobl)}
.bbw{color:var(--bth);border-color:rgba(26,48,96,.3);background:var(--bthl)}
.bbdi{color:var(--bdi);border-color:rgba(26,69,96,.3);background:var(--bdil)}

/* CARD (accordion – used for swim sessions and breathwork) */
.card{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);margin-bottom:.6rem;overflow:hidden}
.card.logged{background:var(--okl);border-color:var(--okb)}
.card-swim{border-left:3px solid var(--swim)} .card-z1{border-left:3px solid var(--z1)}
.card-dA{border-left:3px solid var(--dA)} .card-dB{border-left:3px solid var(--dB)} .card-dC{border-left:3px solid var(--dC)}
.card-mob{border-left:3px solid var(--mob)} .card-bth{border-left:3px solid var(--bth)}
.card-head{display:flex;align-items:center;gap:.7rem;padding:.9rem 1rem;cursor:pointer;user-select:none}
.card-head:active{background:var(--surf2)}
.card-title{flex:1;min-width:0}
.card-title .t{font-weight:700;font-size:.94rem;display:block}
.card-title .s{font-family:var(--mono);font-size:.71rem;color:var(--muted);margin-top:.16rem;display:block}
.done-dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex-shrink:0;transition:all .2s}
.card.logged .done-dot,.dry-direct.logged .done-dot{background:var(--ok);box-shadow:0 0 5px rgba(45,122,58,.4)}
.chev{font-size:.72rem;color:var(--faint);transition:transform .2s;flex-shrink:0}
.card.open>.card-head .chev{transform:rotate(90deg)}
.card-body{max-height:0;overflow:hidden;transition:max-height .28s ease}
.card.open>.card-body{max-height:9999px}
.card-inner{padding:.2rem 1rem 1rem}

/* DIRECT DISPLAY (Dryland sessions – no accordion) */
.dry-direct{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:1rem 1rem 1.1rem}
.dry-direct.logged{background:var(--okl);border-color:var(--okb)}
.dry-direct.vA{border-left:3px solid var(--dA)} .dry-direct.vB{border-left:3px solid var(--dB)} .dry-direct.vC{border-left:3px solid var(--dC)} .dry-direct.vmob{border-left:3px solid var(--mob)}
.ddhdr{display:flex;align-items:center;gap:.7rem;margin-bottom:.85rem;flex-wrap:wrap}
.dd-titles{flex:1;min-width:0}
.dd-title{font-weight:700;font-size:1rem;line-height:1.2}
.dd-sub{font-family:var(--mono);font-size:.71rem;color:var(--muted);margin-top:.16rem}

/* FOCUS CUE */
.focus-cue{background:var(--surf2);border-radius:var(--r);padding:.72rem .88rem;margin-bottom:.85rem;font-size:.83rem}
.cue-lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.22rem;display:block}
.card-swim .cue-lbl,.card-z1 .cue-lbl{color:var(--swim)} .card-dA .cue-lbl,.dry-direct.vA .cue-lbl{color:var(--dA)}
.card-dB .cue-lbl,.dry-direct.vB .cue-lbl{color:var(--dB)} .card-dC .cue-lbl,.dry-direct.vC .cue-lbl{color:var(--dC)}
.card-mob .cue-lbl,.dry-direct.vmob .cue-lbl{color:var(--mob)} .card-bth .cue-lbl{color:var(--bth)}

/* DRILLS */
.drills{display:flex;gap:.38rem;flex-wrap:wrap;margin-bottom:.7rem}
.drl{font-family:var(--mono);font-size:.67rem;color:var(--bth);border-bottom:1px dotted currentColor}
.drt{font-family:var(--mono);font-size:.67rem;color:var(--muted);border:1px solid var(--brd);padding:.13rem .42rem;border-radius:4px}

/* PHASE + ITEMS */
.phase{margin:.8rem 0 .15rem}
.ph-name{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:.42rem;padding-bottom:.36rem;border-bottom:1px solid var(--brd)}
.ph-meta{color:var(--faint);font-size:.58rem}
.item{display:flex;gap:.6rem;padding:.46rem 0;border-bottom:1px solid var(--brd)}
.item:last-child{border-bottom:none}
.chk{flex-shrink:0;width:22px;height:22px;border:1.5px solid var(--faint);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;margin-top:.06rem}
.chk:active{transform:scale(.88)} .chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:'✓';color:#fff;font-size:.77rem;font-weight:800}
.it-body{flex:1;min-width:0}
.it-t{font-size:.87rem} .it-t.struck{text-decoration:line-through;color:var(--faint)}
.it-n{font-size:.75rem;color:var(--muted);margin-top:.13rem;font-family:var(--mono);line-height:1.44}

/* EXERCISE (DRYLAND tracked) */
.ex-item{padding:.68rem 0;border-bottom:1px solid var(--brd)}
.ex-item:last-child{border-bottom:none}
.ex-top{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:.32rem}
.ex-name{font-size:.9rem;font-weight:700;flex:1}
.ex-tgt{font-family:var(--mono);font-size:.65rem;padding:.18rem .48rem;border-radius:4px;flex-shrink:0}
.vA .ex-tgt,.card-dA .ex-tgt{color:var(--dA);background:var(--dAl)} .vB .ex-tgt,.card-dB .ex-tgt{color:var(--dB);background:var(--dBl)} .vC .ex-tgt,.card-dC .ex-tgt{color:var(--dC);background:var(--dCl)}
.ex-mus{font-family:var(--mono);font-size:.63rem;color:var(--faint);margin-bottom:.26rem}
.ex-cue{font-size:.78rem;color:var(--muted);font-family:var(--mono);margin-bottom:.42rem;line-height:1.44;padding-left:.78rem;border-left:2px solid var(--brd)}
.ex-in{display:flex;gap:.42rem;flex-wrap:wrap;margin-top:.32rem}
.ff{display:flex;flex-direction:column;gap:.17rem}
.ff label{font-family:var(--mono);font-size:.57rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ff input{background:var(--bg);border:1.5px solid var(--brd);border-radius:7px;color:var(--ink);padding:.36rem .5rem;font-family:var(--mono);font-size:.79rem;transition:border-color .12s}
.ff input:focus{outline:none}
.vA .ff input:focus,.card-dA .ff input:focus{border-color:var(--dA)} .vB .ff input:focus,.card-dB .ff input:focus{border-color:var(--dB)} .vC .ff input:focus,.card-dC .ff input:focus{border-color:var(--dC)} .vmob .ff input:focus{border-color:var(--mob)}
.ff-r{width:84px} .ff-b{flex:1;min-width:128px}

/* SESSION FOOTER */
.sess-foot{margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--brd)}
.sess-meta{display:flex;gap:.42rem;flex-wrap:wrap;margin-bottom:.58rem}
.sess-meta .ff-rpe{width:70px} .sess-meta .ff-note{flex:1;min-width:150px}
.sess-meta textarea{background:var(--bg);border:1.5px solid var(--brd);border-radius:7px;color:var(--ink);padding:.36rem .5rem;font-family:var(--sans);font-size:.8rem;width:100%;resize:vertical;min-height:34px}
.sess-meta textarea:focus{outline:none;border-color:var(--swim)}
.sess-btns{display:flex;gap:.42rem}
.btn{flex:1;border-radius:var(--r);padding:.65rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;font-weight:700;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-sw{background:var(--swim);color:#fff} .btn-dA{background:var(--dA);color:#fff} .btn-dB{background:var(--dB);color:#fff} .btn-dC{background:var(--dC);color:#fff} .btn-mo{background:var(--mob);color:#fff} .btn-bw{background:var(--bth);color:#fff}
.btn-rst{background:var(--surf2);color:var(--muted);border:1.5px solid var(--brd);flex:0 0 auto;padding:.65rem 1rem}
.sav{font-family:var(--mono);font-size:.67rem;color:var(--ok);margin-top:.36rem;display:none}
.sav.show{display:block}

/* HORIZONTAL WEEK GRID */
.wk-horiz{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.85rem .85rem .7rem;margin-bottom:1rem;overflow-x:auto}
.wkh-inner{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:280px}
.wkh-col{display:flex;flex-direction:column;gap:3px}
.wkh-hdr{text-align:center;padding:4px 2px 6px;border-bottom:1.5px solid var(--brd)}
.wkh-dow{font-family:var(--mono);font-size:.57rem;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:4px}
.wkh-d{font-family:var(--mono);font-size:.9rem;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;width:26px;height:26px;margin:0 auto;border-radius:50%}
.wkh-col.today .wkh-dow{color:var(--swim)} .wkh-col.today .wkh-d{background:var(--swim);color:#fff}
.wkh-col.has-sess .wkh-d{color:var(--ink)}
.wkh-col.done-col .wkh-d{color:var(--faint)}
.wkh-sess{font-family:var(--mono);font-size:.53rem;padding:3px 4px;border-radius:4px;cursor:pointer;text-align:center;line-height:1.3;word-break:break-word;transition:opacity .12s;margin-top:1px}
.wkh-sess:active{opacity:.65}
.wkh-sess.sw{background:var(--swl);color:var(--swim)} .wkh-sess.z1{background:var(--swl);color:var(--z1)}
.wkh-sess.dy{background:var(--dAl);color:var(--dA)}
.wkh-empty{height:26px} /* Spacer for days without sessions */

/* MONTH CALENDAR */
.cal-wrap{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.9rem .9rem .7rem;margin-bottom:1rem}
.cal-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.65rem}
.cal-ml{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cal-tl{font-size:.8rem;font-weight:700;color:var(--swim)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-family:var(--mono);font-size:.55rem;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:center;padding-bottom:.28rem}
.cal-day{min-height:46px;display:flex;flex-direction:column;padding:3px;border-radius:6px;position:relative}
.cal-day.has-s{cursor:pointer} .cal-day.has-s:active{background:var(--surf2)}
.cal-dn{font-family:var(--mono);font-size:.64rem;color:var(--muted);margin-bottom:2px;padding-left:2px}
.cal-day.has-s .cal-dn{color:var(--ink);font-weight:600} .cal-day.today .cal-dn{color:var(--swim);font-weight:800}
.cal-day.today::before{content:'';position:absolute;top:1px;left:1px;right:1px;bottom:1px;border:2px solid var(--swim);border-radius:5px;pointer-events:none}
.cal-ev{font-family:var(--mono);font-size:.52rem;padding:2px 3px;border-radius:3px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px;position:relative;z-index:1}
.cal-ev.esw{background:var(--swl);color:var(--swim)} .cal-ev.ez1{background:var(--swl);color:var(--z1)} .cal-ev.edy{background:var(--dAl);color:var(--dA)}

/* PACING */
.pacing-box{background:var(--swl);border:1.5px solid rgba(26,74,46,.18);border-radius:var(--r2);padding:.9rem;margin-bottom:1rem}
.pacing-box h3{font-size:.88rem;font-weight:700;color:var(--swim);margin-bottom:.18rem}
.pacing-note{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-bottom:.62rem}
.pace-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.pcell{background:#fff;border:1.5px solid rgba(26,74,46,.14);border-radius:7px;padding:.4rem .28rem;text-align:center}
.pcell.hot{border-color:var(--swim)}
.pz{font-family:var(--mono);font-size:.56rem;color:var(--muted);text-transform:uppercase}
.pv{font-family:var(--mono);font-size:.88rem;font-weight:600;margin-top:.1rem}
.pcell.hot .pv{color:var(--swim)}

/* BADI */
.badi-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-bottom:.7rem}
@media(min-width:480px){.badi-stat-grid{grid-template-columns:repeat(3,1fr)}}
.badi-cell{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.65rem .8rem}
.badi-cell-name{font-size:.76rem;font-weight:700;margin-bottom:.28rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badi-bar-bg{height:5px;background:var(--brd);border-radius:3px;overflow:hidden;margin-bottom:.2rem}
.badi-bar{height:100%;border-radius:3px;transition:width .5s}
.badi-pct{font-family:var(--mono);font-size:.64rem;color:var(--muted);margin-bottom:.16rem}
.badi-status{font-family:var(--mono);font-size:.61rem;font-weight:700}
.bst-g{color:var(--ok)} .bst-y{color:#b07a00} .bst-r{color:var(--dA)}
.badi-ts{font-family:var(--mono);font-size:.58rem;color:var(--faint);text-align:center;margin:0 0 1rem;padding:.42rem 0;border-top:1px solid var(--brd)}

/* HEATMAP */
.hm-wrap{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.9rem;margin-bottom:.85rem;overflow-x:auto}
.hm-sel{display:flex;gap:.25rem;flex-wrap:wrap;margin-bottom:.7rem}
.hm-pill{font-family:var(--mono);font-size:.62rem;padding:.22rem .62rem;border-radius:999px;border:1.5px solid var(--brd);color:var(--muted);cursor:pointer;transition:all .12s}
.hm-pill.on{background:var(--bdi);color:#fff;border-color:var(--bdi)}
.hm-lbl{font-family:var(--mono);font-size:.56rem;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:1px}
.hm-cell{height:17px;border-radius:2px;cursor:default}
.hm-legend{display:flex;align-items:center;gap:.45rem;margin-top:.5rem}
.hm-leg-bar{display:flex;gap:2px;flex:1}
.hm-leg-cell{flex:1;height:7px;border-radius:2px}
.hm-leg-lbl{font-family:var(--mono);font-size:.56rem;color:var(--muted)}

/* ORACLE */
.oracle-wrap{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.9rem;margin-bottom:.85rem}
.oracle-hdr{display:flex;align-items:flex-start;gap:1rem;margin-bottom:.65rem}
.oracle-svg{flex-shrink:0;opacity:.9}
.oracle-intro{flex:1}
.oracle-name{font-size:.9rem;font-weight:700;color:var(--bdi);margin-bottom:.2rem}
.oracle-desc{font-family:var(--mono);font-size:.68rem;color:var(--muted);line-height:1.5}
.oracle-grid{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.6rem}
.oracle-slot{background:var(--bg);border:1.5px solid var(--brd);border-radius:var(--r);padding:.48rem .6rem;min-width:56px;text-align:center}
.oracle-slot.best{border-color:var(--ok);background:var(--okl)}
.oracle-h{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-bottom:.18rem}
.oracle-p{font-family:var(--mono);font-size:.92rem;font-weight:700}
.oracle-tip{font-family:var(--mono);font-size:.56rem;color:var(--ok);margin-top:.18rem}
.oracle-best{font-family:var(--mono);font-size:.71rem;color:var(--ok);padding:.5rem .7rem;background:var(--okl);border:1px solid var(--okb);border-radius:var(--r)}

/* MOBILITY CARDS */
.mob-card{background:var(--surf);border:1.5px solid var(--brd);border-left:3px solid var(--mob);border-radius:var(--r2);padding:.88rem 1rem;margin-bottom:.55rem;transition:background .15s,border-color .15s}
.mob-card.mc-done{background:var(--okl);border-color:var(--okb)}
.mob-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.42rem}
.mob-name{font-size:.9rem;font-weight:700;flex:1}
.mob-reps{font-family:var(--mono);font-size:.66rem;color:var(--mob);background:var(--mobl);padding:.17rem .48rem;border-radius:4px;flex-shrink:0}
.mob-mus{font-family:var(--mono);font-size:.62rem;color:var(--faint);margin-bottom:.28rem}
.mob-note{font-size:.8rem;color:var(--muted);line-height:1.5}

.mob-chk:active{transform:scale(.9)} .mob-chk.on{background:var(--ok);border-color:var(--ok)}
.mob-chk.on::after{content:'✓';color:#fff;font-size:.82rem;font-weight:800}

.bw-btns{display:flex;gap:.42rem;margin-top:.75rem}
.bw-visual{display:flex;flex-direction:column;align-items:center;padding:.7rem 0}
.bw-circle{width:115px;height:115px;border-radius:50%;border:2px solid var(--bth);background:radial-gradient(circle at 50% 40%,rgba(26,48,96,.1),transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 1s ease;transform:scale(.62)}
.bw-phase{font-family:var(--mono);font-size:.8rem;color:var(--bth);text-align:center}
.bw-count{font-family:var(--mono);font-size:1.7rem;font-weight:700;margin-top:.65rem;min-width:3rem;text-align:center}
.bw-rnd{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-top:.18rem}

.mth-block h2{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(232,240,228,.6);margin-bottom:1rem}
.mth-principle{display:grid;grid-template-columns:1.6rem 1fr;gap:.65rem;padding:.75rem 0;border-bottom:1px solid rgba(255,255,255,.1)}
.mth-principle:last-child{border-bottom:none}
.mth-pnum{font-family:var(--mono);font-size:.62rem;color:rgba(232,240,228,.5);padding-top:.1rem}
.mth-pbody strong{display:block;font-size:.88rem;font-weight:700;margin-bottom:.18rem;color:#e8f0e4}
.mth-pbody p{font-size:.78rem;color:rgba(232,240,228,.72);line-height:1.5}

.mth-role{font-family:var(--mono);font-size:.58rem;color:var(--muted);text-align:right;flex-shrink:0}
.mth-concurrent{background:var(--surf);border:1.5px solid var(--brd);border-left:3px solid var(--dB);border-radius:var(--r2);padding:.9rem 1rem;margin-bottom:.9rem}

.he-t{font-weight:700;font-size:.87rem} .he-d{font-family:var(--mono);font-size:.66rem;color:var(--muted);flex-shrink:0}

.pb-n{font-weight:700;font-size:.87rem;margin-bottom:.18rem} .pb-d{font-family:var(--mono);font-size:.72rem;color:var(--muted)}

const KEY='besko_hub_v3';

/* ===== UTILS ===== */
const e=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const today=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const todayFmt=()=>new Date().toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'});
const qs=(s,r=document)=>r.querySelector(s);
const qsa=(s,r=document)=>[...r.querySelectorAll(s)];

const findCard=k=>[...document.querySelectorAll('[data-card]')].find(el=>el.dataset.card===k);

/* ===== RENDER: PACING ===== */
function renderPacing(){return`<div class="pacing-box"><h3>Pacing · /100m</h3><div class="pacing-note">${e(PACING.note)}</div><div class="pace-grid">${PACING.cells.map(x=>`<div class="pcell${x.hot?' hot':''}"><div class="pz">${e(x.z)}</div><div class="pv">${e(x.v)}</div></div>`).join('')}</div></div>`;}

/* ===== RENDER: PHASES (generic) ===== */
function renderPhases(key,phases){
  return phases.map(p=>{
    const items=p.items.map(it=>{
      if(it.ex){
        const rk=it.id;const ck=STATE.checks[rk];const rv=STATE.inputs[rk+'_r']||'';const bv=STATE.inputs[rk+'_b']||'';
        return`<div class="ex-item"><div class="ex-top"><div class="chk${ck?' on':''}" data-exchk="${e(rk)}"></div><div class="ex-name${ck?' struck':''}">${e(it.name)}</div><div class="ex-tgt">${e(it.tgt)}</div></div><div class="ex-mus">${e(it.mus)} · ${e(it.rest)}</div>${it.cue?`<div class="ex-cue">${e(it.cue)}</div>`:''}<div class="ex-in"><div class="ff ff-r"><label>Reps actual</label><input data-ei="r" data-rk="${e(rk)}" value="${e(rv)}" placeholder="${e(it.tgt)}"></div><div class="ff ff-b"><label>Band / Gewicht</label><input data-ei="b" data-rk="${e(rk)}" value="${e(bv)}" placeholder="z.B. Grünes Band / KB 16"></div></div></div>`;
      }
      return`<div class="item"><div class="it-body"><div class="it-t">${e(it.t)}</div>${it.n?`<div class="it-n">${e(it.n).replace(/\n/g,'<br>')}</div>`:''}</div></div>`;
    }).join('');
    return`<div class="phase"><div class="ph-name"><span>${e(p.name)}</span>${p.meta?`<span class="ph-meta">${e(p.meta)}</span>`:''}</div>${items}</div>`;
  }).join('');
}

/* ===== RENDER: SESSION FOOTER ===== */
function renderFoot(key,btnCls,title){
  return`<div class="sess-foot"><div class="sess-meta"><div class="ff ff-rpe"><label>RPE 1–10</label><input inputmode="numeric" data-si="rpe" data-key="${e(key)}" value="${e(STATE.inputs[key+'_rpe']||'')}" placeholder="–"></div><div class="ff ff-note"><label>Notiz</label><textarea data-si="note" data-key="${e(key)}" placeholder="Pace, Gefühl…">${e(STATE.inputs[key+'_note']||'')}</textarea></div></div><div class="sess-btns"><button class="btn ${btnCls}" data-log="${e(key)}" data-title="${e(title)}">Session loggen</button><button class="btn btn-rst" data-reset="${e(key)}">Reset</button></div><div class="sav" data-sav="${e(key)}">✓ Gespeichert</div></div>`;
}

/* ===== RENDER: SWIM CARD (accordion) ===== */
function renderSwimCard(s){
  const key='swim:'+s.id;const logged=!!STATE.done[key];
  const drills=s.drills?.map(d=>d.u?`<a class="drl" href="${e(d.u)}" target="_blank" rel="noopener">▶ ${e(d.n)}</a>`:`<span class="drt">${e(d.n)}</span>`).join('')||'';
  return`<div class="card card-${s.acc}${logged?' logged':''}" data-card="${e(key)}"><div class="card-head" data-toggle="${e(key)}"><span class="done-dot"></span><span class="badge ${s.bc}">${e(s.badge)}</span><span class="card-title"><span class="t">${e(s.title)}</span><span class="s">${e(s.sub)}</span></span><span class="chev">▶</span></div><div class="card-body"><div class="card-inner">${s.focus?`<div class="focus-cue"><span class="cue-lbl">${e(s.cue)}</span>${e(s.focus)}</div>`:''}<div class="drills">${drills}</div>${renderPhases(key,s.phases)}${renderFoot(key,'btn-sw',s.badge+' – '+s.title)}</div></div></div>`;
}

/* ===== CALENDAR ===== */
function renderCalendar(){
  const td=today();
  const dow=['Mo','Di','Mi','Do','Fr','Sa','So'];
  let h=`<div class="cal-wrap"><div class="cal-hdr"><span class="cal-ml">Juni 2026</span><span class="cal-tl">The Kick</span></div><div class="cal-grid">`;
  dow.forEach(d=>{h+=`<div class="cal-dow">${d}</div>`;});
  for(let day=1;day<=30;day++){
    const ds=`2026-06-${String(day).padStart(2,'0')}`;
    const sess=SCHED[ds]||[];const hasSess=sess.length>0;const isToday=ds===td;
    const cls=['cal-day',hasSess?'has-s':'',isToday?'today':''].filter(Boolean).join(' ');
    const evs=sess.map(s=>{
      const ecls=s.type==='swim'?(s.id.startsWith('Z1')?'ez1':'esw'):'edy';
      const lbl=calLabel(s.type,s.id);
      return`<div class="cal-ev ${ecls}" data-csid="${e(s.id)}" data-ctype="${e(s.type)}">${e(lbl)}</div>`;
    }).join('');
    h+=`<div class="${cls}"${hasSess?` data-cday="${ds}"`:''}><div class="cal-dn">${day}</div>${evs}</div>`;
  }
  h+='</div></div>';return h;
}

/* ===== HORIZONTAL WEEK GRID ===== */
function renderWeekGrid(){
  const td=today();const now=new Date();const dowNow=(now.getDay()+6)%7;
  const dow=['Mo','Di','Mi','Do','Fr','Sa','So'];
  let h=`<div class="wk-horiz"><div class="wkh-inner">`;
  for(let i=0;i<7;i++){
    const d=new Date(now);d.setDate(now.getDate()-dowNow+i);
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const sess=SCHED[ds]||[];const isToday=ds===td;const hasSess=sess.length>0;
    let cls='wkh-col';if(isToday)cls+=' today';if(hasSess)cls+=' has-sess';
    h+=`<div class="${cls}"><div class="wkh-hdr"><span class="wkh-dow">${dow[i]}</span><span class="wkh-d">${d.getDate()}</span></div>`;
    if(sess.length){
      sess.forEach(s=>{
        const sc=s.type==='swim'?(s.id.startsWith('Z1')?'z1':'sw'):'dy';
        const lbl=calLabel(s.type,s.id);
        h+=`<div class="wkh-sess ${sc}" data-goto-tab="${s.type==='dry'?'dry':'swim'}" data-goto-id="${e(s.id)}">${e(lbl)}</div>`;
      });
    }
    h+='</div>';
  }
  h+='</div></div>';return h;
}

/* ===== BADI ===== */
let badiRows=[];let badiLoaded=false;let badiLoading=false;let selectedBadi='Hallenbad City';
const BADIS=[
  {id:'hb_city',name:'Hallenbad City',keys:['hallenbad city','hallenbad_city','hb city','city']},
  {id:'utoquai',name:'Seebad Utoquai',keys:['utoquai','uto']},
  {id:'letzi',name:'Freibad Letzigraben',keys:['letzigraben','letzi']},
  {id:'heuried',name:'Hallenbad Heuried',keys:['heuried']},
  {id:'letten',name:'Ob. Letten',keys:['letten','oberer letten','flussbad']}
];
const BADI_SHORT={hb_city:'HB City',utoquai:'Utoquai',letzi:'Letzigraben',heuried:'Heuried',letten:'Ob. Letten'};

function matchBadi(name){
  const nl=name.toLowerCase().trim();
  for(const b of BADIS){for(const k of b.keys){if(nl.includes(k)||k.includes(nl))return b.id;}}
  return null;
}
function pctColor(p){if(p===null)return'var(--surf2)';if(p<15)return'#1e3a5f';if(p<30)return'#1f5f9a';if(p<45)return'#2d8a5e';if(p<60)return'#c9a900';if(p<75)return'#c05a00';if(p<90)return'#9b1a1a';return'#6b0f0f';}
function statusLabel(p){if(p===null)return['–',''];if(p<30)return['Sehr frei ✓','bst-g'];if(p<50)return['Gut frei','bst-g'];if(p<65)return['Mittel','bst-y'];if(p<80)return['Belebt','bst-y'];return['Voll','bst-r'];}

async function loadBadi(){
  if(badiLoaded||badiLoading)return;
  badiLoading=true;
  try{
    const urls=['https://raw.githubusercontent.com/derbsq/Badi-Tracker/main/data/occupancy.csv',
                'https://raw.githubusercontent.com/derbsq/Badi-Tracker/main/data/badi_data.csv'];
    let text=null;
    for(const url of urls){
      try{const res=await fetch(url);if(res.ok){text=await res.text();break;}}catch(e){}
    }
    if(!text){badiLoading=false;updateBadiUI('Keine Verbindung zum GitHub-Repo.');return;}
    const lines=text.trim().split('\n');
    if(lines.length<2){badiLoading=false;updateBadiUI('CSV leer oder unlesbar.');return;}
    const hdr=lines[0].split(',').map(h=>h.trim().toLowerCase().replace(/['"]/g,''));
    // Debug: log first few rows to console
    console.log('[Badi CSV] Header:',hdr);
    console.log('[Badi CSV] First row:',lines[1]);
    const tC=hdr.findIndex(h=>h.includes('time')||h.includes('ts')||h==='date');
    const nC=hdr.findIndex(h=>h.includes('badi')||h.includes('name')||h.includes('facility')||h.includes('pool'));
    const pC=hdr.findIndex(h=>h.includes('pct')||h.includes('percent')||h==='load'||h.includes('occupancy'));
    const cC=hdr.findIndex(h=>h.includes('current')||h.includes('count')||h.includes('abs'));
    const mC=hdr.findIndex(h=>h.includes('max')||h.includes('capacity'));
    console.log('[Badi CSV] Columns: t='+tC+' n='+nC+' p='+pC+' c='+cC+' m='+mC);
    badiRows=[];
    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(',').map(c=>c.trim().replace(/^["']|["']$/g,''));
      if(cols.length<2)continue;
      const tsStr=tC>=0?cols[tC]:'';const name=nC>=0?cols[nC]:'';
      let pct=pC>=0?parseFloat(cols[pC]):NaN;
      if(isNaN(pct)&&cC>=0&&mC>=0){const c2=parseFloat(cols[cC]),m2=parseFloat(cols[mC]);if(!isNaN(c2)&&!isNaN(m2)&&m2>0)pct=c2/m2*100;}
      if(!tsStr||!name||isNaN(pct))continue;
      const ts=new Date(tsStr);if(isNaN(ts.getTime()))continue;
      const ageDays=(Date.now()-ts.getTime())/86400000;
      badiRows.push({ts,name,pct:Math.round(pct),dow:(ts.getDay()+6)%7,hour:ts.getHours(),ageDays});
    }
    console.log('[Badi CSV] Parsed rows:',badiRows.length,'Sample:',badiRows.slice(-3));
    badiLoaded=badiRows.length>0;
  }catch(err){console.error('[Badi]',err);}
  badiLoading=false;
  updateBadiUI(null);
}

function updateBadiUI(errMsg){
  const sg=qs('#badi-stat');if(sg)sg.innerHTML=errMsg?`<div class="warn-box">Badi: ${e(errMsg)}</div>`:renderStatusGrid();
  const db=qs('#dash-badi');if(db)db.innerHTML=errMsg?`<div class="warn-box">Badi: ${e(errMsg)}</div>`:renderStatusGridMini();
  const hg=qs('#hm-grid-wrap');if(hg)hg.innerHTML=renderHeatmapHtml(selectedBadi);
  const og=qs('#oracle-wrap');if(og)og.innerHTML=renderOracleHtml(selectedBadi);
}

function getCurrentStatus(){
  const latest={};const cutoff=Date.now()-40*60000;
  badiRows.forEach(r=>{if(r.ts.getTime()<cutoff)return;const bid=matchBadi(r.name);if(!bid)return;if(!latest[bid]||r.ts>latest[bid].ts)latest[bid]=r;});
  return latest;
}

function renderStatusGrid(){
  if(!badiLoaded)return`<div class="loading">Lade Badi-Daten…</div>`;
  const ls=getCurrentStatus();
  const cells=BADIS.map(b=>{
    const d=ls[b.id];const pct=d?d.pct:null;
    const[stxt,scls]=statusLabel(pct);const bc=pctColor(pct);
    return`<div class="badi-cell"><div class="badi-cell-name">${e(b.name)}</div><div class="badi-bar-bg"><div class="badi-bar" style="width:${pct??0}%;background:${bc}"></div></div><div class="badi-pct">${pct!==null?pct+'%':'–'}</div><div class="badi-status ${scls}">${stxt}</div></div>`;
  }).join('');
  const vals=Object.values(ls);const latestTs=vals.length?vals.sort((a,b)=>b.ts-a.ts)[0].ts:null;
  const tsLbl=latestTs?`Letztes Update: ${latestTs.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})} Uhr`:'Daten aus CSV geladen';
  return`<div class="badi-stat-grid">${cells}</div><div class="badi-ts">${tsLbl}</div>`;
}

function renderStatusGridMini(){
  if(!badiLoaded)return`<div class="loading">Lade Badi-Daten…</div>`;

  const cells=BADIS.map(b=>{
    const d=ls[b.id];const pct=d?d.pct:null;

    return`<div class="badi-cell"><div class="badi-cell-name">${e(BADI_SHORT[b.id]||b.name)}</div><div class="badi-bar-bg"><div class="badi-bar" style="width:${pct??0}%;background:${bc}"></div></div><div class="badi-pct">${pct!==null?pct+'%':'–'}</div></div>`;
  }).join('');
  return`<div class="badi-stat-grid">${cells}</div>`;
}

function buildHeatmap(badiId){
  const grid=Array.from({length:7},()=>Array.from({length:16},()=>({sum:0,cnt:0})));
  badiRows.forEach(r=>{
    if(matchBadi(r.name)!==badiId)return;
    const h=r.hour-5;if(h<0||h>=16)return;
    grid[r.dow][h].sum+=r.pct;grid[r.dow][h].cnt++;
  });
  return grid.map(row=>row.map(c=>c.cnt>0?Math.round(c.sum/c.cnt):null));
}

function getOracle(badiId){
  const now=new Date();const dow=(now.getDay()+6)%7;const hr=now.getHours();
  return Array.from({length:8},(_,dh)=>{
    const th=(hr+dh)%24;const td2=dh>=(24-hr)?((dow+1)%7):dow;
    const similar=badiRows.filter(r=>matchBadi(r.name)===badiId&&r.dow===td2&&Math.abs(r.hour-th)<=1);
    if(!similar.length)return{h:th,pct:null};
    let sw=0,sp=0;similar.forEach(r=>{const w=Math.exp(-0.023*r.ageDays);sw+=w;sp+=w*r.pct;});
    return{h:th,pct:Math.round(sp/sw)};
  });
}

function renderHeatmapHtml(badiId){
  if(!badiLoaded)return`<div class="loading">Daten werden geladen…</div>`;
  const grid=buildHeatmap(badiId);
  const days=['Mo','Di','Mi','Do','Fr','Sa','So'];const hours=Array.from({length:16},(_,i)=>i+5);
  const now=new Date();const todayDow=(now.getDay()+6)%7;const curH=now.getHours();
  let h=`<div class="hm-grid" style="display:grid;grid-template-columns:22px repeat(16,1fr);gap:2px;">`;
  h+=`<div class="hm-lbl"></div>`;
  hours.forEach(hr=>{h+=`<div class="hm-lbl" style="${hr===curH?'color:var(--swim);font-weight:700':''}">${hr}</div>`;});
  days.forEach((d,di)=>{
    const isToday=di===todayDow;
    h+=`<div class="hm-lbl" style="${isToday?'color:var(--swim);font-weight:700':''}">${d}</div>`;
    hours.forEach((hr,hi)=>{
      const val=grid[di][hi];const c=pctColor(val);const op=val!==null?1:0.2;const isCur=isToday&&hr===curH;
      h+=`<div class="hm-cell" style="background:${c};opacity:${op};${isCur?'box-shadow:0 0 0 2px var(--swim)':''}" title="${val!==null?val+'%':'–'}"></div>`;
    });
  });
  h+='</div>';
  h+=`<div class="hm-legend"><span class="hm-leg-lbl">Leer</span><div class="hm-leg-bar">${[0,20,35,52,68,80,93].map(p=>`<div class="hm-leg-cell" style="background:${pctColor(p)}"></div>`).join('')}</div><span class="hm-leg-lbl">Voll</span></div>`;
  if(badiRows.length===0)h+=`<div class="debug-box">Hinweis: 0 Rows geparst. Öffne die Konsole (F12) um die CSV-Struktur zu sehen.</div>`;
  return h;
}

function renderOracleHtml(badiId){
  if(!badiLoaded)return`<div class="loading">Daten werden geladen…</div>`;
  const preds=getOracle(badiId);
  const best=preds.reduce((a,b)=>(b.pct!==null&&(a===null||b.pct<a.pct))?b:a,null);
  const bname=BADIS.find(b=>b.id===badiId)?.name||badiId;
  const slots=preds.map(p=>{
    const isBest=best&&p.h===best.h&&p.pct!==null;
    return`<div class="oracle-slot${isBest?' best':''}"><div class="oracle-h">${String(p.h).padStart(2,'0')}:00</div><div class="oracle-p" style="color:${pctColor(p.pct)}">${p.pct!==null?p.pct+'%':'–'}</div>${isBest?'<div class="oracle-tip">beste Zeit</div>':''}</div>`;
  }).join('');
  const bestTxt=best&&best.pct!==null?`Beste Zeit heute ca. ${String(best.h).padStart(2,'0')}:00 Uhr — ca. ${best.pct}% erwartet`:'';
  return`<div class="oracle-hdr">${BESM_SVG}<div class="oracle-intro"><div class="oracle-name">Bésmeralda · ${e(bname)}</div><div class="oracle-desc">Bésmeraldas Funky Fortune Telling Service · kNN mit exponentiellem Recency-Gewicht</div></div></div><div class="oracle-grid">${slots}</div>${bestTxt?`<div class="oracle-best">→ ${e(bestTxt)}</div>`:''}`;
}

        ['02','Concurrent Training Management','Wer gleichzeitig Kraft- und Ausdauertraining macht, riskiert eine gegenseitige Abschwächung der Anpassungen ("Interference Effect", Wilson et al., 2012). Lösung: Schwimmen zuerst, Dryland danach — mindestens 4–6 h Abstand, wenn am selben Tag. Schwimmen hat immer Priorität.'],
        ['03','Strukturelle Balance — Pull:Push-Ratio','Schwimmer leisten im Wasser fast ausschließlich Zugarbeit — bei 4 Sessions × ~3 km × ~20 Züge/25m sind das grob 10.000+ Pull-Bewegungen pro Woche. Dryland muss diese Dominanz nicht verdoppeln, sondern ausbalancieren: Pull-Volumen hoch, Push-Volumen niedrig, Schultergesundheit aktiv schützen.'],
        ['04','Progressive Overload','Anpassungen entstehen nur, wenn der Körper konsequent leicht über seiner aktuellen Kapazität gefordert wird. Der Plan steigert systematisch: erst Form, dann Volumen, dann Intensität/Power. Nicht alles auf einmal.'],
        ['05','Verletzungsprävention als Leistungsprinzip','Eine Woche Ausfall durch Schulter- oder Hüftprobleme kostet mehr als drei Wochen suboptimales Training. Rotatoren, Scapula-Stabilisatoren und Hüftstrukturen werden daher explizit trainiert — nicht als Zusatz, sondern als Fundament.']
      ].map(([n,t,p])=>`<div class="mth-principle"><span class="mth-pnum">${n}</span><div class="mth-pbody"><strong>${e(t)}</strong><p>${e(p)}</p></div></div>`).join('')}
    </div>

    <div class="sec-label">Primäre Muskulatur im Crawl-Zug</div>
    <div class="mth-anatomy">
      <h3>Was im Wasser zählt</h3>
      <div class="mth-muscle-grid">
        ${[['Latissimus dorsi','Hauptmotor Zug'],['Teres major','Zug / Adduktion'],['Serratus anterior','Scapula-Stabilität'],['Rotatorenmanschette','Schultergesundheit'],['Rektus abdominis / Oblique','Core / Rotation'],['Glutes / Hamstrings','Kick / Wasserlage'],['Hüftbeuger / Iliopsoas','Kick-Recovery'],['Rhomboiden / Trapez','Scapula-Kontrolle']].map(([m,r])=>`<div class="mth-muscle">${e(m)}<span class="mth-role">${e(r)}</span></div>`).join('')}
      </div>
    </div>

    <div class="mth-concurrent">
      <h3>Concurrent Training — Interference Effect im Detail</h3>
      <p>Wilson et al. (2012) zeigten in einer Meta-Analyse, dass Kraft-Hypertrophie-Adaptationen signifikant reduziert werden, wenn Ausdauertraining in unmittelbarer zeitlicher Nähe stattfindet. Ursache: AMPK-Aktivierung durch Ausdauerbelastung hemmt den mTOR-Signalweg, der für Muskelproteinsynthese benötigt wird.</p>
      <p>Für diesen Plan: Schwimmeinheiten morgens, Dryland abends — oder an Tagen ohne harte Schwimmeinheit. Kein Dryland direkt vor einer intensiven CSS- oder Intervalleinheit. Die aerobe Z1-Session verträgt Dryland am gleichen Tag besser als eine 85%-CSS-Session.</p>
    </div>

    <div class="sec-label">Session 1 — Pull & Posterior Chain</div>
    <div style="margin-bottom:1rem">
      <span class="sec-tag tag-s1">Session 1</span>
      ${[
        ['Pull-Ups','Latissimus · Teres major · Bizeps · Rhomboiden','Der Latissimus ist der primäre Kraftgeber in der Unterwasserphase des Crawl — von der Catch-Position bis zum Finish. Toussaint & Beek (1992) zeigten, dass propulsive Kraft im Schwimmen fast ausschließlich durch die obere Extremität erzeugt wird, mit dem Lat als dominantem Muskel. Klimmzüge sind die direkteste Möglichkeit, diesen Muskel im Dryland zu trainieren.','Pull-up-Bewegungsmuster: Schulteradduktion + -extension, identisch mit der Zugphase im Wasser.','Toussaint & Beek (1992) · Morouco et al. (2011)',null],
        ['Single-Arm Band Row','Lat · Rhomboiden · Trapez · Posteriore Schulter','Ergänzt das Pull-up-Volumen mit einem horizontalen Zugmuster. Trainiert gleichzeitig die Scapula-Retraktoren — diese sind bei Schwimmern chronisch unteraktiv, weil das Wasser keinen horizontalen Widerstand bietet. Schwache Scapula-Kontrolle führt langfristig zu Impingement.','Einarmig, um Rotationsasymmetrien zu detektieren und auszugleichen.',null,null],
        ['Single-Leg Romanian Deadlift','Hamstrings · Glutes · Rückenstrecker','Die posteriore Kette ist für die Beinschlag-Kraftphase und die horizontale Wasserlage mitverantwortlich. Einbeinige Ausführung trainiert gleichzeitig die hüftstabilisierende Muskulatur — relevant bei Hüftsteifigkeit und Schambeinanamnese.','Hüftscharnierübung: trainiert die exzentrische Belastbarkeit der Hamstrings.',null,null],
        ['Hollow Hold','Rektus abdominis · Transversus abdominis · Hüftbeuger','Die stromlinienförmige Körperposition im Wasser entspricht exakt der Hollow-Body-Position. Diese isometrische Anti-Extension-Übung schult das neuromuskuläre Muster, das Schwimmer benötigen, um Energie nicht durch Körperwelligkeit zu verlieren.','Anti-Extension Core: verhindert, dass die LWS unter Belastung in die Streckung geht — im Wasser gleichbedeutend mit sinkenden Hüften.','Weston et al. (2015) — Core stability and swimming performance',null],
        ['Pallof Press','Oblique · Transversus · Gluteus medius','Crawl-Schwimmen erfordert eine präzise Rotation um die Längsachse — während der Core gleichzeitig gegen übermäßige Rotation stabilisiert. Das Pallof Press trainiert genau diese Anti-Rotations-Kapazität.','Anti-Rotation Core: spiegelt die Anforderung, stabile Kraft bei asymmetrischen Armzügen zu halten.',null,null]
      ].map(([n,m,w,mech,ref,vid])=>`<div class="mth-ex"><div class="mth-ex-top"><span class="mth-ex-name">${e(n)}</span><span class="mth-ex-mus">${e(m)}</span></div><p class="mth-ex-why">${e(w)}</p><p class="mth-ex-mech">${e(mech)}</p>${ref?`<div class="mth-ex-ref">Ref: ${e(ref)}</div>`:''}</div>`).join('')}
    </div>

    <div class="sec-label">Session 2 — Core, Hüfte & Shoulder Health</div>
    <div style="margin-bottom:1rem">
      <span class="sec-tag tag-s2">Session 2</span>
      <div class="mth-ratio"><div><h4>Pull-Volumen</h4><div class="mth-ratio-big">~70%</div><p>Lat, Row, Pulldowns, Inverted Rows — der Motor im Wasser</p></div><div><h4>Push-Volumen</h4><div class="mth-ratio-big">~30%</div><p>Push-ups, Flys — Balance und Ästhetik, nicht Kraft-Dominanz</p></div></div>
      ${[
        ['Side Plank mit Hüfthebung','Gluteus medius · Oblique · Quadratus lumborum','Der Gluteus medius ist entscheidend für laterale Hüftstabilität — im Schwimmen verhindert er ein seitliches Abkippen der Hüfte beim Kick-Zyklus. Schwache Abduktoren sind ein häufiger Faktor bei Schambeinbeschwerden.','Frontale Ebene Stabilität — trainiert die laterale Rumpfkraft, die bei Rotation im Wasser stabilisiert.',null],
        ['Copenhagen Plank','Adduktoren · Hüftstabilisatoren · Core','Die Adduktoren sind bei klassischem Schwimmtraining systematisch unterversorgt. Gleichzeitig ist die Adduktoren-Belastbarkeit kritisch für Schambein-Resilienz.','Isometrische Adduktionsarbeit in einer Hip-Abduktion-Position — hohe Muskelaktivierung bei geringem Verletzungsrisiko.','Serner et al. (2018), Br J Sports Med'],
        ['Band External Rotation','Infraspinatus · Teres minor · Rotatorenmanschette','Das wichtigste Präventionswerkzeug für Schwimmer. Die Rotatorenmanschette zentriert den Humerus in der Pfanne — bei hohem Schwimmvolumen wird die interne Rotation (Zugphase) dominant, die externe Rotation vernachlässigt. Resultat: Schulterimpingement ("Swimmer\'s Shoulder").','Ruwe et al. (1994) und Bak & Fauno (1997) dokumentierten, dass über 70% der Wettkampfschwimmer irgendwann Schulterbeschwerden entwickeln.','Ruwe et al. (1994) · Bak & Fauno (1997), Am J Sports Med']
      ].map(([n,m,w,mech,ref])=>`<div class="mth-ex"><div class="mth-ex-top"><span class="mth-ex-name">${e(n)}</span><span class="mth-ex-mus">${e(m)}</span></div><p class="mth-ex-why">${e(w)}</p><p class="mth-ex-mech">${e(mech)}</p>${ref?`<div class="mth-ex-ref">Ref: ${e(ref)}</div>`:''}</div>`).join('')}
    </div>

    <div class="sec-label">Session 3 — Power & Pulling Endurance</div>
    <div style="margin-bottom:1rem">
      <span class="sec-tag tag-s3">Session 3</span>
      ${[
        ['Explosive Band Pulldowns','Latissimus · Teres major · Triceps','Rate of Force Development (RFD) im Catch-Moment ist entscheidend für Vortrieb. Je schneller du in der Catch-Phase Kraft aufbaust, desto mehr Wasser greifst du — und desto weniger Energie verlierst du durch Gleiten ohne Kraftübertragung.','Explosiv konzentrisch + kontrolliert exzentrisch. Das Band bietet einen variablen Widerstand, der am Zugbeginn niedriger ist — ähnlich wie im Wasser.',null],
        ['Inverted Rows / Australian Pull-Ups','Rhomboiden · Mittlerer Trapez · Posteriore Schulter','Horizontale Zugbewegung — trainiert Scapula-Retraktoren, die im Wasser kaum aktiviert werden. Ergänzt Pull-ups (vertikaler Zug) für ein vollständiges Rücken-Kraftprofil.','Im Calisthenics-Park unter einem niedrigen Gerüst, oder unter einem stabilen Tisch. Körper gerade wie ein Brett — je horizontaler, desto schwerer.',null],
        ['KB Swings / Band Hip Hinge explosiv','Glutes · Hamstrings · Rückenstrecker · Core','Explosiver Hüftstrecker-Training. Im Schwimmen treibt die Hüftstreckung den Beinschlag — nicht das Knie. Swings trainieren die ballistische Kraftentwicklung der Gluteus-Hamstring-Kette.','Hinging, nicht squatting: Hüfte nach hinten, nicht Knie nach vorne — ein häufiges Technikmissverständnis beim Kettlebell Swing.',null],
        ['Hanging Knee Raises','Iliopsoas · Rektus abdominis · Griffkraft','Hängende Core-Arbeit kombiniert Hüftbeugung mit Schulter-Stabilität unter Eigengewichtsbelastung — ein funktionelles Muster, das im Wasser beim Kick-Recovery vorkommt.','Progression: Knie heben → Beine gestreckt heben → L-Sit Holds. Langsam steigern.',null]
      ].map(([n,m,w,mech,ref])=>`<div class="mth-ex"><div class="mth-ex-top"><span class="mth-ex-name">${e(n)}</span><span class="mth-ex-mus">${e(m)}</span></div><p class="mth-ex-why">${e(w)}</p><p class="mth-ex-mech">${e(mech)}</p>${ref?`<div class="mth-ex-ref">Ref: ${e(ref)}</div>`:''}</div>`).join('')}
    </div>

    <div class="mth-big">
      <h3>Das große Bild — Warum dieser Plan und nicht ein anderer</h3>
      <p>Ein klassisches Fitnessprogramm (Bankdrücken, Bizepscurls, Beinpresse) würde dein Schwimmen kaum verbessern und möglicherweise sogar hemmen — durch Schulterüberlastung, fehlende Spezifität und falsches Kraftprofil. Dieser Plan ist umgekehrt aufgebaut: von der Bewegung im Wasser zurück auf die Übung im Dryland.</p>
      <p>Der Latissimus ist der Motor. Der Core ist der Kraftüberträger. Die Hüfte ist die Basis. Die Schulter ist der Schwachpunkt. Alles andere ist Beigabe.</p>
      <p>Der Brustfokus sitzt bewusst klein — weil eine breite Brust aus Push-up-Progression und Flys entsteht, ohne das Schultergleichgewicht zu kippen, das du für dein Schwimmvolumen brauchst.</p>
    </div>`;
}

/* ===== VIEW: VERLAUF ===== */
function viewLog(){
  const el=qs('#v-log');
  let h=`<div class="sec-label" style="margin-top:.1rem">Session-Verlauf</div>`;
  if(!STATE.history.length){h+=`<div class="empty">Noch keine Sessions geloggt.</div>`;}
  else{[...STATE.history].reverse().forEach(e2=>{h+=`<div class="hist-e"><div class="he-hd"><span class="he-t">${e(e2.title)}</span><span class="he-d">${e(e2.date)}</span></div><div class="he-s">${e(e2.summary)}</div></div>`;});}
  h+=`<div class="sec-label">Dryland-Progression</div>`;
  const pkeys=Object.keys(STATE.progress);
  if(!pkeys.length){h+=`<div class="empty">Noch keine Dryland-Reps geloggt.</div>`;}
  else{pkeys.forEach(id=>{const arr=STATE.progress[id];if(!arr?.length)return;const last=arr[arr.length-1];const nm=findExName(id)||id;const nums=arr.map(x=>parseInt(x.reps)||0).filter(n=>n>0);h+=`<div class="pb-e"><div class="pb-n">${e(nm)}</div><div class="pb-d">Zuletzt: ${e(last.reps||'–')}${last.band?' · '+e(last.band):''} · ${e(last.date)} · ${arr.length} Einträge</div>${sparkline(nums)}</div>`;});}
  el.innerHTML=h;
}

function findExName(id){for(const s of DRYLAND)for(const p of s.phases)for(const it of p.items)if(it.ex&&it.id===id)return it.name;return null;}
function sparkline(nums){if(nums.length<2)return'';const w=120,hh=28,mn=Math.min(...nums),mx=Math.max(...nums),rng=(mx-mn)||1;const pts=nums.map((n,k)=>{const x=(k/(nums.length-1))*(w-4)+2;const y=hh-2-((n-mn)/rng)*(hh-4);return`${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');return`<svg class="spark" width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}"><polyline points="${pts}" fill="none" stroke="var(--swim)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;}

/* ===== LOGGING ===== */
function flashSav(key){const el=qs(`[data-sav]`,[...document.querySelectorAll('[data-sav]')].find(el=>el.dataset.sav===key)?document:[]);const target=[...document.querySelectorAll('[data-sav]')].find(el=>el.dataset.sav===key);if(target){target.classList.add('show');setTimeout(()=>target.classList.remove('show'),2400);}}

function logSession(key,title){
  const[type,id]=key.split(':');let summary='';
  if(type==='dry'){
    const s=DRYLAND.find(d=>d.id===id);
    if(s){const lines=[];s.phases.forEach(p=>p.items.forEach(it=>{if(it.ex){const reps=STATE.inputs[it.id+'_r']||'';const band=STATE.inputs[it.id+'_b']||'';if(reps||band){lines.push(`• ${it.name}: ${reps||'–'}${band?' · '+band:''}`);STATE.progress[it.id]=STATE.progress[it.id]||[];STATE.progress[it.id].push({date:todayFmt(),reps,band});}}}));summary=lines.join('\n');}
  }
  const rpe=STATE.inputs[key+'_rpe'];const note=STATE.inputs[key+'_note'];
  if(rpe)summary+=(summary?'\n':'')+'RPE '+rpe;
  if(note)summary+=(summary?'\n':'')+'„'+note+'"';
  STATE.history.push({key,date:todayFmt(),ts:Date.now(),title,summary:summary||'–'});
  STATE.done[key]=true;persist();
  const card=findCard(key);if(card){card.classList.add('logged');const dot=card.querySelector('.done-dot');if(dot)dot.style.background='var(--ok)';}
  const dd=qs(`.dry-direct`,[...document.querySelectorAll('.dry-direct')].find(el=>el.querySelector(`[data-log="${key}"]`))?document:document);const ddTarget=[...document.querySelectorAll('.dry-direct')].find(el=>el.querySelector(`[data-log="${key}"]`));if(ddTarget){ddTarget.classList.add('logged');const dot=ddTarget.querySelector('.done-dot');if(dot)dot.style.background='var(--ok)';}
  flashSav(key);rendered.log=false;rendered.dash=false;
}

/* ===== BREATHWORK ===== */
let bwT=null;
function stopBW(){if(bwT){clearTimeout(bwT);bwT=null;}}
function startBW(id){
  stopBW();const b=BREATH.find(x=>x.id===id);if(!b)return;
  let round=1,pi=0;
  function run(){
    const p=b.pattern[pi];
    const phEl=qs(`#bwph-${id}`),ctEl=qs(`#bwct-${id}`),rnEl=qs(`#bwrn-${id}`),ciEl=qs(`#bwc-${id}`);
    if(!phEl)return;phEl.textContent=p.label;
    if(ciEl){const sc=/ein/i.test(p.label)?'scale(1)':/aus/i.test(p.label)?'scale(.6)':null;if(sc){ciEl.style.transitionDuration=p.sec+'s';ciEl.style.transform=sc;}}
    if(rnEl)rnEl.textContent=`Runde ${round} / ${b.rounds}`;
    let left=p.sec;if(ctEl)ctEl.textContent=left;
    function tick(){left--;if(ctEl)ctEl.textContent=Math.max(left,0);
      if(left<=0){pi++;if(pi>=b.pattern.length){pi=0;round++;if(round>b.rounds){if(phEl)phEl.textContent='Fertig ✓';if(ctEl)ctEl.textContent='';stopBW();return;}}run();return;}
      bwT=setTimeout(tick,1000);}
    bwT=setTimeout(tick,1000);
  }run();
}

/* ===== TAB MANAGEMENT ===== */
const rendered={};
function show(tabName,scrollId){
  stopBW();
  qsa('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tabName));
  qsa('.view').forEach(v=>v.classList.toggle('on',v.dataset.view===tabName));
  const alwaysRefresh=['dash','log'];
  if(alwaysRefresh.includes(tabName)||!rendered[tabName]){
    if(tabName==='dash')viewDash();
    else if(tabName==='swim')viewSwim();
    else if(tabName==='dry')viewDry();
    else if(tabName==='badi'){viewBadi();if(!badiLoaded&&!badiLoading)loadBadi();}
    else if(tabName==='method')viewMethod();
    else if(tabName==='log')viewLog();
    rendered[tabName]=true;
  }
  window.scrollTo({top:0,behavior:'auto'});
  if(scrollId){
    setTimeout(()=>{
      const card=findCard(tabName+':'+scrollId);
      if(!card)return;
      card.classList.add('open');
      const nav=qs('nav');const navH=nav?nav.offsetHeight:55;
      const top=card.getBoundingClientRect().top+window.scrollY-navH-12;
      window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
    },90);
  }
}

function showSub(subId){
  qsa('.stab').forEach(t=>t.classList.toggle('on',t.dataset.sub===subId));
  qsa('.subview').forEach(v=>v.classList.toggle('on',v.id===`sv-${subId}`));
}

/* ===== EVENTS ===== */
document.addEventListener('click',ev=>{
  const tab=ev.target.closest('.tab');if(tab){show(tab.dataset.tab);return;}
  const stab=ev.target.closest('.stab');if(stab){showSub(stab.dataset.sub);return;}
  
  const tog=ev.target.closest('[data-toggle]');
  if(tog){
    const k=tog.dataset.toggle;
    if(k==='hb-info'){
      const bd=qs('#hb-info-body');if(bd)bd.classList.toggle('open');
      const c=tog.querySelector('.chev');if(c)c.style.transform=c.style.transform.includes('90')?'':'rotate(90deg)';return;
    }
    const card=findCard(k);if(card)card.classList.toggle('open');return;
  }

  const cday=ev.target.closest('[data-cday]');
  if(cday){
    const ds=cday.dataset.cday;const csid=ev.target.dataset.csid;const ctype=ev.target.dataset.ctype;
    if(csid&&ctype){show(ctype==='dry'?'dry':'swim',csid);}
    else{const sess=SCHED[ds]||[];if(sess.length){const s=sess[0];show(s.type==='dry'?'dry':'swim',s.id);}}
    return;
  }
  const wrow=ev.target.closest('[data-goto-tab]');if(wrow){show(wrow.dataset.gotoTab,wrow.dataset.gotoId);return;}
  const lb=ev.target.closest('[data-log]');if(lb){logSession(lb.dataset.log,lb.dataset.title||lb.dataset.log);return;}
  const rb=ev.target.closest('[data-reset]');
  if(rb){
    const key=rb.dataset.reset;const id=key.split(':').slice(1).join(':');
    if(key.startsWith('dry:')){DRYLAND.find(d=>d.id===id)?.phases.forEach(p=>p.items.forEach(it=>{if(it.ex){delete STATE.checks[it.id];const el=[...document.querySelectorAll('[data-exchk]')].find(e=>e.dataset.exchk===it.id);if(el){el.classList.remove('on');const nm=el.parentNode.querySelector('.ex-name');if(nm)nm.classList.remove('struck');}}}));}
    persist();return;
  }
  const xc=ev.target.closest('[data-exchk]');
  if(xc){const rk=xc.dataset.exchk;STATE.checks[rk]=!STATE.checks[rk];persist();xc.classList.toggle('on',STATE.checks[rk]);const nm=xc.parentNode.querySelector('.ex-name');if(nm)nm.classList.toggle('struck',STATE.checks[rk]);return;}
  const mc=ev.target.closest('[data-mobchk]');
  if(mc){const mk=mc.dataset.mobchk;STATE.checks[mk]=!STATE.checks[mk];persist();mc.classList.toggle('on',STATE.checks[mk]);const cd=mc.closest('.mob-card');if(cd)cd.classList.toggle('mc-done',STATE.checks[mk]);return;}
  const bwS=ev.target.closest('[data-bwstart]');if(bwS){startBW(bwS.dataset.bwstart);return;}
  const bwSt=ev.target.closest('[data-bwstop]');if(bwSt){stopBW();return;}
  const bds=ev.target.closest('[data-bdsel]');
  if(bds){
    selectedBadi=bds.dataset.bdsel;
    qsa('.hm-pill').forEach(p=>p.classList.toggle('on',p.dataset.bdsel===selectedBadi));
    const hg=qs('#hm-grid-wrap');if(hg)hg.innerHTML=renderHeatmapHtml(selectedBadi);
    const og=qs('#oracle-wrap');if(og)og.innerHTML=renderOracleHtml(selectedBadi);return;
  }
});

document.addEventListener('input',ev=>{
  const si=ev.target.closest('[data-si]');
  if(si){STATE.inputs[si.dataset.key+'_'+si.dataset.si]=ev.target.value;persist();return;}
  const ei=ev.target.closest('[data-ei]');
  if(ei){STATE.inputs[ei.dataset.rk+'_'+ei.dataset.ei]=ev.target.value;persist();}
});

/* ===== INIT ===== */
show('dash');
loadBadi();
setInterval(loadBadi,10*60*1000);

})();
</script>
