<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bésko's Little Training Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1eb;--surf:#ede9e0;--surf2:#e5dfd4;--brd:#d5d0c5;
  --ink:#1a1a18;--muted:#6b6860;--faint:#aaa49d;
  --swim:#1a4a2e;--swl:#e8f0e4;
  --dA:#8b3a1a;--dAl:#f5ede8;--dB:#1a3060;--dBl:#e8edf5;--dC:#5a1a6e;--dCl:#f0e8f5;
  --mob:#5a1a6e;--mobl:#f0e8f5;--bth:#1a3060;--bthl:#e8edf5;
  --bdi:#1a4560;--bdil:#e8f0f5;
  --ok:#2d7a3a;--okl:rgba(45,122,58,.08);--okb:rgba(45,122,58,.22);
  --next:#2c5282;--nextl:#ebf0fb;--z1:#3a8a5a;
  --gym:#7a4a00;--gyml:#f5efe0;
  --sans:'Syne',sans-serif;--mono:'DM Mono',monospace;
  --r:10px;--r2:14px;--pad:1.1rem;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:-webkit-fill-available}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;line-height:1.5;padding-bottom:5.5rem}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,textarea,select{font:inherit}a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* LAYOUT */
.wrap{max-width:760px;margin:0 auto;padding:0 var(--pad)}
header{padding:2.8rem var(--pad) 2rem;max-width:760px;margin:0 auto;border-bottom:2px solid var(--ink);text-align:center}
h1{font-size:clamp(1.35rem,5vw,2.2rem);font-weight:800;letter-spacing:-.025em;line-height:1.1}
.h1m{color:var(--muted);font-weight:600}

/* NAV TABS */
nav{position:sticky;top:0;z-index:50;background:rgba(244,241,235,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1.5px solid var(--brd);text-align:center;overflow-x:auto}
.tabs{display:inline-flex;gap:.2rem;padding:.45rem .65rem;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font-family:var(--mono);font-size:.63rem;letter-spacing:.05em;color:var(--muted);border:1.5px solid transparent;border-radius:999px;padding:.38rem .8rem;white-space:nowrap;transition:all .12s}
.tab.on{color:var(--bg);font-weight:700}
.tab[data-tab=dash].on{background:var(--ink)}
.tab[data-tab=badi].on{background:var(--bdi)}
.tab[data-tab=swim].on{background:var(--swim)}
.tab[data-tab=dry].on{background:var(--dA)}
.tab[data-tab=method].on{background:var(--dC)}
.tab[data-tab=log].on{background:var(--ink)}
main{padding-top:.5rem}
.view{display:none;animation:vu .16s ease}.view.on{display:block}
@keyframes vu{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* SECTION LABELS */
.sl{font-family:var(--mono);font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:1.8rem 0 .7rem}
.sl.first{margin-top:1.4rem}

/* WEATHER STRIP */
.wx{display:flex;align-items:center;gap:.5rem;background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r);padding:.55rem .85rem;margin-bottom:.9rem;font-family:var(--mono);font-size:.7rem}
.wx-icon{font-size:1.3rem;flex-shrink:0}
.wx-main{font-size:.9rem;font-weight:700;color:var(--swim)}
.wx-sub{color:var(--muted);font-size:.62rem;margin-top:.05rem}
.wx-right{margin-left:auto;text-align:right;font-size:.62rem;color:var(--muted)}

/* ICAL CALENDAR */
.cal-wrap{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.85rem .85rem 1rem;margin-bottom:1.1rem}
.cal-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6rem}
.cal-ml{font-family:var(--mono);font-size:.61rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cal-tl{font-weight:800;font-size:.86rem;color:var(--swim);letter-spacing:-.01em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-dow{font-family:var(--mono);font-size:.5rem;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);text-align:center;padding-bottom:.35rem}
.cal-day{display:flex;flex-direction:column;align-items:center;padding:3px 1px 5px;border-radius:7px;cursor:default;min-height:40px;transition:background .1s;position:relative}
.cal-day.has-s{cursor:pointer}
.cal-day.has-s:active{background:var(--surf2)}
.cal-day.today .cal-dn-w{background:var(--dA);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.cal-dn{font-family:var(--mono);font-size:.63rem;color:var(--faint)}
.cal-day.has-s .cal-dn{color:var(--ink);font-weight:700}
.cal-dn-w{display:flex;align-items:center;justify-content:center;width:20px;height:20px}
.cal-dots{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap;justify-content:center;max-width:30px}
.cal-dot{width:5px;height:5px;border-radius:50%}
.cal-dot.sw{background:var(--swim)}
.cal-dot.z1{background:var(--z1)}
.cal-dot.dy{background:var(--dA)}
.cal-dot.dy2{background:var(--dB)}
.cal-dot.dy3{background:var(--dC)}

/* CAL EVENTS PANEL (below calendar) */
.cal-events-panel{background:var(--surf2);border-radius:var(--r);padding:.65rem .85rem;margin-top:.55rem;display:none}
.cal-events-panel.show{display:block}
.cal-ev-date{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.cal-ev-item{display:flex;align-items:center;gap:.55rem;padding:.38rem 0;border-bottom:1px solid var(--brd)}
.cal-ev-item:last-child{border-bottom:none}
.cal-ev-badge{font-family:var(--mono);font-size:.57rem;padding:.15rem .42rem;border-radius:4px;flex-shrink:0;white-space:nowrap}
.cal-ev-text{flex:1;min-width:0;font-size:.8rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ev-sub{font-family:var(--mono);font-size:.6rem;color:var(--muted)}
.cal-ev-goto{font-family:var(--mono);font-size:.57rem;color:var(--swim);border-bottom:1px dotted;flex-shrink:0}

/* WEEK LIST */
.week-day{margin-bottom:.85rem}
.week-day-hdr{font-family:var(--mono);font-size:.63rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:.38rem;display:flex;align-items:center;gap:.42rem}
.week-day-hdr.today{color:var(--swim);font-weight:700}
.today-tag{background:var(--swim);color:#fff;font-size:.52rem;padding:.08rem .35rem;border-radius:3px}

/* BADI STATUS GRID — like original tracker */
.badi-stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.55rem;margin-bottom:.85rem}
@media(min-width:450px){.badi-stat-grid{grid-template-columns:repeat(5,1fr)}}
.badi-cell{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.7rem .75rem;position:relative;overflow:hidden}
.badi-cell-status-bar{position:absolute;bottom:0;left:0;height:3px;border-radius:0 3px 3px 0;transition:width .4s}
.badi-cell-name{font-size:.75rem;font-weight:700;margin-bottom:.3rem;line-height:1.2}
.badi-pct{font-family:var(--mono);font-size:1.2rem;font-weight:700;line-height:1;margin-bottom:.12rem}
.badi-status{font-family:var(--mono);font-size:.58rem;font-weight:700}
.bst-g{color:var(--ok)}.bst-y{color:#b07a00}.bst-r{color:var(--dA)}.bst-x{color:var(--faint)}
.badi-ts{font-family:var(--mono);font-size:.55rem;color:var(--faint);text-align:center;margin-bottom:1rem}

/* CARDS */
.card{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);margin-bottom:.6rem;overflow:hidden}
.card.logged{background:var(--okl);border-color:var(--okb)}
.card.card-next{border-color:var(--next);background:var(--nextl)}
.card-swim{border-left:3px solid var(--swim)}.card-z1{border-left:3px solid var(--z1)}
.card-dA{border-left:3px solid var(--dA)}.card-dB{border-left:3px solid var(--dB)}.card-dC{border-left:3px solid var(--dC)}
.card-mob{border-left:3px solid var(--mob)}.card-bth{border-left:3px solid var(--bth)}
.card-head{display:flex;align-items:center;gap:.65rem;padding:.82rem .9rem;cursor:pointer;user-select:none}
.card-head:active{background:var(--surf2)}
.card-title{flex:1;min-width:0}
.card-title .t{font-weight:700;font-size:.9rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-title .s{font-family:var(--mono);font-size:.67rem;color:var(--muted);margin-top:.1rem;display:block}
.done-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0;transition:all .18s}
.card.logged .done-dot{background:var(--ok);box-shadow:0 0 5px rgba(45,122,58,.35)}
.chev{font-size:.68rem;color:var(--faint);transition:transform .18s;flex-shrink:0}
.card.open>.card-head .chev{transform:rotate(90deg)}
.card-body{max-height:0;overflow:hidden;transition:max-height .26s ease}
.card.open>.card-body{max-height:9999px}
.card-inner{padding:.2rem .9rem 1rem}
.next-badge{font-family:var(--mono);font-size:.54rem;background:var(--next);color:#fff;padding:.11rem .38rem;border-radius:4px;flex-shrink:0}

/* BADGES */
.badge{font-family:var(--mono);font-size:.57rem;letter-spacing:.05em;padding:.16rem .46rem;border-radius:999px;border:1.5px solid;flex-shrink:0;white-space:nowrap;display:inline-flex;align-items:center}
.bsw{color:var(--swim);border-color:rgba(26,74,46,.3);background:var(--swl)}
.bz1{color:var(--z1);border-color:rgba(58,138,90,.3);background:var(--swl)}
.bdA{color:var(--dA);border-color:rgba(139,58,26,.3);background:var(--dAl)}
.bdB{color:var(--dB);border-color:rgba(26,48,96,.3);background:var(--dBl)}
.bdC{color:var(--dC);border-color:rgba(90,26,110,.3);background:var(--dCl)}
.bbdi{color:var(--bdi);border-color:rgba(26,69,96,.3);background:var(--bdil)}

/* STIM PILLS */
.stim-wrap{display:flex;gap:.35rem;flex-wrap:wrap;margin:.45rem 0 .65rem}
.stim{font-family:var(--mono);font-size:.6rem;padding:.18rem .46rem;border-radius:4px;background:var(--surf2);color:var(--muted);border:1px solid var(--brd)}
.stim.s-hi{background:rgba(139,58,26,.07);color:var(--dA);border-color:rgba(139,58,26,.2)}
.stim.s-aer{background:var(--swl);color:var(--swim);border-color:rgba(26,74,46,.2)}
.stim.s-thr{background:rgba(26,48,96,.07);color:var(--dB);border-color:rgba(26,48,96,.2)}

/* FOCUS CUE */
.focus-cue{background:var(--surf2);border-radius:var(--r);padding:.65rem .8rem;margin-bottom:.8rem;font-size:.8rem;line-height:1.5}
.cue-lbl{font-family:var(--mono);font-size:.57rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.2rem;display:block}
.card-swim .cue-lbl,.card-z1 .cue-lbl{color:var(--swim)}
.card-dA .cue-lbl{color:var(--dA)}.card-dB .cue-lbl{color:var(--dB)}.card-dC .cue-lbl{color:var(--dC)}

/* DRILLS */
.drills{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.7rem}
.drl{font-family:var(--mono);font-size:.63rem;color:var(--bth);border-bottom:1px dotted currentColor}
.drt{font-family:var(--mono);font-size:.63rem;color:var(--muted);border:1px solid var(--brd);padding:.1rem .38rem;border-radius:4px}

/* PHASES & ITEMS */
.phase{margin:.75rem 0 .12rem}
.ph-name{font-family:var(--mono);font-size:.59rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:.38rem;padding-bottom:.32rem;border-bottom:1px solid var(--brd)}
.ph-meta{color:var(--faint);font-size:.55rem}
.item{padding:.4rem 0;border-bottom:1px solid var(--brd)}
.item:last-child{border-bottom:none}
.it-t{font-size:.84rem}
.it-n{font-size:.73rem;color:var(--muted);margin-top:.1rem;font-family:var(--mono);line-height:1.45;white-space:pre-wrap}

/* EXERCISES */
.ex-item{padding:.62rem 0;border-bottom:1px solid var(--brd)}
.ex-item:last-child{border-bottom:none}
.ex-top{display:flex;align-items:flex-start;gap:.55rem;margin-bottom:.28rem}
.ex-name{font-size:.88rem;font-weight:700;flex:1}
.ex-tgt{font-family:var(--mono);font-size:.61rem;padding:.15rem .42rem;border-radius:4px;flex-shrink:0}
.vA .ex-tgt{color:var(--dA);background:var(--dAl)}
.vB .ex-tgt{color:var(--dB);background:var(--dBl)}
.vC .ex-tgt{color:var(--dC);background:var(--dCl)}
.ex-mus{font-family:var(--mono);font-size:.6rem;color:var(--faint);margin-bottom:.24rem}
.ex-cue{font-size:.77rem;color:var(--muted);font-family:var(--mono);margin-bottom:.38rem;line-height:1.44;padding-left:.72rem;border-left:2px solid var(--brd)}
.ex-in{display:flex;gap:.38rem;flex-wrap:wrap;margin-top:.3rem;align-items:flex-end}
.ff{display:flex;flex-direction:column;gap:.12rem}
.ff label{font-family:var(--mono);font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ff input{background:var(--bg);border:1.5px solid var(--brd);border-radius:7px;color:var(--ink);padding:.3rem .44rem;font-family:var(--mono);font-size:.77rem;transition:border-color .12s;-webkit-appearance:none}
.ff input:focus{outline:none}
.vA .ff input:focus{border-color:var(--dA)}.vB .ff input:focus{border-color:var(--dB)}.vC .ff input:focus{border-color:var(--dC)}
.ff-r{width:76px}.ff-b{flex:1;min-width:110px}.ff-rpe{width:62px}.ff-note{flex:1;min-width:130px}
.ff textarea{resize:vertical;min-height:30px;width:100%;font-family:var(--sans);font-size:.78rem;background:var(--bg);border:1.5px solid var(--brd);border-radius:7px;padding:.3rem .44rem}
.ex-yt{display:inline-flex;align-items:center;gap:.28rem;font-family:var(--mono);font-size:.59rem;color:#c00;margin-top:.25rem;border-bottom:1px dotted rgba(204,0,0,.4)}
.ex-done-btn{font-family:var(--mono);font-size:.57rem;padding:.22rem .55rem;border-radius:6px;border:1.5px solid var(--brd);color:var(--muted);cursor:pointer;flex-shrink:0;transition:all .15s;background:transparent}
.ex-done-btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.ex-item.done-ex{opacity:.55}

/* DRYLAND DIRECT */
.dry-direct{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:1rem .9rem;transition:background .15s,border-color .15s;margin-bottom:.6rem}
.dry-direct.logged{background:var(--okl);border-color:var(--okb)}
.dry-direct.vA{border-left:3px solid var(--dA)}
.dry-direct.vB{border-left:3px solid var(--dB)}
.dry-direct.vC{border-left:3px solid var(--dC)}
.ddhdr{display:flex;align-items:center;gap:.65rem;margin-bottom:.85rem;flex-wrap:wrap}
.dd-titles{flex:1;min-width:0}
.dd-title{font-weight:700;font-size:.95rem;line-height:1.2}
.dd-sub{font-family:var(--mono);font-size:.67rem;color:var(--muted);margin-top:.1rem}
.dd-controls{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-left:auto}
.gym-toggle{font-family:var(--mono);font-size:.59rem;padding:.25rem .6rem;border-radius:999px;border:1.5px solid var(--brd);color:var(--muted);cursor:pointer;background:transparent;transition:all .15s;white-space:nowrap}
.gym-toggle.active{background:var(--gym);border-color:var(--gym);color:#fff}
.dd-done-toggle{font-family:var(--mono);font-size:.59rem;padding:.25rem .6rem;border-radius:999px;border:1.5px solid var(--brd);color:var(--muted);cursor:pointer;background:transparent;transition:all .15s;white-space:nowrap}
.dry-direct.logged .dd-done-toggle{background:var(--ok);border-color:var(--ok);color:#fff}

/* TIMER */
.timer-wrap{display:inline-flex;align-items:center;gap:.35rem;margin-left:.5rem}
.timer-btn{width:26px;height:26px;border-radius:50%;background:var(--bdi);color:#fff;font-size:.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none;cursor:pointer}
.timer-disp{font-family:var(--mono);font-size:.75rem;color:var(--bdi);min-width:2.5rem;text-align:center}

/* PACING GRID */
.pacing-box{background:var(--swl);border:1.5px solid rgba(26,74,46,.18);border-radius:var(--r2);padding:.9rem;margin-bottom:1rem}
.pacing-box h3{font-size:.86rem;font-weight:700;color:var(--swim);margin-bottom:.15rem}
.pacing-sub{font-family:var(--mono);font-size:.66rem;color:var(--muted);margin-bottom:.65rem}
.pace-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.28rem;margin-bottom:.65rem}
.pcell{background:#fff;border:1.5px solid rgba(26,74,46,.14);border-radius:7px;padding:.38rem .22rem;text-align:center}
.pcell.hot{border-color:var(--swim);background:var(--swl)}
.pz{font-family:var(--mono);font-size:.52rem;color:var(--muted);text-transform:uppercase}
.pv{font-family:var(--mono);font-size:.82rem;font-weight:600;margin-top:.07rem}
.pcell.hot .pv{color:var(--swim)}

/* CSS CALCULATOR (standalone) */
.css-calc-box{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.9rem;margin-bottom:1rem}
.css-calc-box h3{font-size:.86rem;font-weight:700;margin-bottom:.5rem}
.css-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.css-row label{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--swim)}
.css-row input{background:#fff;border:1.5px solid rgba(26,74,46,.25);border-radius:7px;color:var(--ink);padding:.28rem .44rem;font-family:var(--mono);font-size:.8rem;width:76px;transition:border-color .12s;-webkit-appearance:none}
.css-row input:focus{outline:none;border-color:var(--swim)}
.css-result-big{font-family:var(--mono);font-size:1.4rem;font-weight:700;color:var(--swim);margin:.45rem 0 .25rem}
.css-hint{font-family:var(--mono);font-size:.58rem;color:var(--muted);line-height:1.5}
.css-pb-list{margin-top:.6rem}
.css-pb-entry{display:flex;justify-content:space-between;align-items:center;padding:.28rem 0;border-bottom:1px solid var(--brd);font-family:var(--mono);font-size:.66rem}
.css-pb-entry:last-child{border-bottom:none}
.css-pb-val{font-weight:700;color:var(--swim)}
.css-pb-date{color:var(--faint)}
.css-pb-add{display:flex;gap:.38rem;margin-top:.5rem;flex-wrap:wrap}
.css-pb-add input{background:var(--bg);border:1.5px solid var(--brd);border-radius:7px;padding:.28rem .44rem;font-family:var(--mono);font-size:.72rem;width:76px}

/* SESSION GENERATOR */
.gen-box{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.9rem;margin-bottom:1rem}
.gen-box h3{font-size:.86rem;font-weight:700;margin-bottom:.15rem}
.gen-sub{font-family:var(--mono);font-size:.64rem;color:var(--muted);margin-bottom:.65rem}
.gen-row{display:flex;gap:.45rem;margin-bottom:.45rem}
.gen-input{flex:1;background:var(--bg);border:1.5px solid var(--brd);border-radius:var(--r);padding:.55rem .65rem;font-family:var(--sans);font-size:.85rem;min-width:0;-webkit-appearance:none}
.gen-input:focus{outline:none;border-color:var(--swim)}
.gen-btn{background:var(--swim);color:#fff;border-radius:var(--r);padding:.55rem 1rem;font-family:var(--mono);font-size:.68rem;font-weight:700;white-space:nowrap;flex-shrink:0}
.gen-btn:active{opacity:.85}
.gen-loading{font-family:var(--mono);font-size:.72rem;color:var(--muted);animation:pulse 1.2s ease-in-out infinite}
.gen-result{background:var(--swl);border:1.5px solid rgba(26,74,46,.18);border-radius:var(--r);padding:.8rem}

/* WEEKLY SWIM GRID */
.wk-swim-group{margin-bottom:1.4rem}
.wk-swim-label{font-family:var(--mono);font-size:.59rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.wk-swim-row{display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem}
@media(min-width:500px){.wk-swim-row{grid-template-columns:repeat(4,1fr)}}
.wk-swim-cell{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.7rem .65rem;cursor:pointer;transition:all .12s;position:relative;overflow:hidden}
.wk-swim-cell::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r2) var(--r2) 0 0}
.wk-swim-cell.wsc-sw::before{background:var(--swim)}
.wk-swim-cell.wsc-z1::before{background:var(--z1)}
.wk-swim-cell.logged{background:var(--okl);border-color:var(--okb)}
.wk-swim-cell.logged::before{background:var(--ok)}
.wk-swim-cell.is-next{border-color:var(--next);background:var(--nextl)}
.wk-swim-cell.is-next::before{background:var(--next)}
.wk-swim-cell:active{transform:scale(.97)}
.wsc-flag{font-family:var(--mono);font-size:.54rem;margin-bottom:.2rem;font-weight:700}
.wsc-flag.fn{color:var(--next)}.wsc-flag.fd{color:var(--ok)}
.wsc-badge{font-family:var(--mono);font-size:.54rem;color:var(--muted);margin-bottom:.24rem}
.wsc-title{font-size:.8rem;font-weight:700;line-height:1.2;margin-bottom:.14rem}
.wsc-meta{font-family:var(--mono);font-size:.61rem;color:var(--muted)}
.wsc-empty{background:var(--bg);border:1.5px dashed var(--brd);border-radius:var(--r2);padding:.7rem;display:flex;align-items:center;justify-content:center}
.wsc-empty span{font-family:var(--mono);font-size:.59rem;color:var(--faint)}

/* LOG */
.hist-e{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.75rem .9rem;margin-bottom:.45rem}
.he-hd{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.22rem}
.he-t{font-weight:700;font-size:.84rem}
.he-d{font-family:var(--mono);font-size:.62rem;color:var(--muted);flex-shrink:0}
.he-s{font-family:var(--mono);font-size:.69rem;color:var(--muted);line-height:1.52;white-space:pre-wrap}
.empty{color:var(--faint);font-family:var(--mono);font-size:.76rem;text-align:center;padding:2.5rem 0}
.loading{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-align:center;padding:1.5rem 0;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* SESSION FOOTER */
.sess-foot{margin-top:.85rem;padding-top:.85rem;border-top:1px solid var(--brd)}
.sess-meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.48rem}
.sess-btns{display:flex;gap:.4rem}
.btn{flex:1;border-radius:var(--r);padding:.6rem;font-family:var(--mono);font-size:.67rem;letter-spacing:.04em;font-weight:700;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-sw{background:var(--swim);color:#fff}
.btn-dA{background:var(--dA);color:#fff}
.btn-dB{background:var(--dB);color:#fff}
.btn-dC{background:var(--dC);color:#fff}
.btn-mo{background:var(--mob);color:#fff}
.btn-bw{background:var(--bth);color:#fff}
.btn-rst{background:var(--surf2);color:var(--muted);border:1.5px solid var(--brd);flex:0 0 auto;padding:.6rem .9rem}
.sav{font-family:var(--mono);font-size:.64rem;color:var(--ok);margin-top:.3rem;display:none}
.sav.show{display:block}

/* SUBTABS */
.subtabs{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none;margin-bottom:1.2rem}
.subtabs::-webkit-scrollbar{display:none}
.stab{flex:0 0 auto;font-family:var(--mono);font-size:.64rem;letter-spacing:.04em;color:var(--muted);border:1.5px solid var(--brd);border-radius:999px;padding:.35rem .75rem;white-space:nowrap;transition:all .12s}
.stab.on{border-color:transparent;color:var(--bg);font-weight:700}
.stab.sa.on{background:var(--dA)}.stab.sb.on{background:var(--dB)}.stab.sc.on{background:var(--dC)}
.stab.sm.on{background:var(--mob)}.stab.sbw.on{background:var(--bth)}
.subview{display:none}.subview.on{display:block}

/* METHOD */
.mth-block{background:var(--swim);color:#e8f0e4;padding:1.3rem;border-radius:var(--r2);margin-bottom:.9rem}
.mth-block h2{font-family:var(--mono);font-size:.59rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(232,240,228,.5);margin-bottom:.85rem}
.mth-principle{display:grid;grid-template-columns:1.4rem 1fr;gap:.55rem;padding:.65rem 0;border-bottom:1px solid rgba(255,255,255,.1)}
.mth-principle:last-child{border-bottom:none}
.mth-pnum{font-family:var(--mono);font-size:.59rem;color:rgba(232,240,228,.45);padding-top:.1rem}
.mth-pbody strong{display:block;font-size:.84rem;font-weight:700;margin-bottom:.14rem;color:#e8f0e4}
.mth-pbody p{font-size:.75rem;color:rgba(232,240,228,.7);line-height:1.5}
.mth-anatomy{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.9rem;margin-bottom:.85rem}
.mth-anatomy h3{font-family:var(--mono);font-size:.59rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.65rem}
.mth-muscle-grid{display:grid;grid-template-columns:1fr 1fr;gap:.25rem}
.mth-muscle{font-size:.75rem;padding:.38rem .58rem;background:var(--bg);border:1px solid var(--brd);border-radius:7px;display:flex;justify-content:space-between;align-items:center;gap:.38rem}
.mth-role{font-family:var(--mono);font-size:.55rem;color:var(--muted);text-align:right;flex-shrink:0}
.mth-ex{padding:.82rem 0;border-bottom:1px solid var(--brd)}
.mth-ex:last-child{border-bottom:none}
.mth-ex-top{display:flex;align-items:baseline;gap:.55rem;margin-bottom:.35rem;flex-wrap:wrap}
.mth-ex-name{font-weight:700;font-size:.88rem}
.mth-ex-mus{font-family:var(--mono);font-size:.57rem;color:var(--muted)}
.mth-ex-why{font-size:.79rem;color:var(--ink);margin-bottom:.3rem;line-height:1.55}
.mth-ex-mech{font-size:.74rem;color:var(--muted);font-style:italic;padding-left:.78rem;border-left:2px solid var(--brd);line-height:1.5}
.mth-ex-yt{display:inline-flex;align-items:center;gap:.28rem;font-family:var(--mono);font-size:.59rem;color:#c00;padding:.16rem .44rem;border:1px solid rgba(204,0,0,.3);border-radius:4px;margin-top:.3rem}

/* BADI BÉSMERALDA */
.oracle-wrap{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.85rem;margin-bottom:.85rem}
.oracle-hdr{display:flex;align-items:flex-start;gap:.85rem;margin-bottom:.6rem}
.oracle-img{width:72px;height:72px;border-radius:var(--r);object-fit:cover;object-position:top center;flex-shrink:0}
.oracle-name{font-size:.86rem;font-weight:800;margin-bottom:.15rem}
.oracle-sub{font-family:var(--mono);font-size:.61rem;color:var(--bdi);margin-bottom:.12rem}
.oracle-desc{font-family:var(--mono);font-size:.62rem;color:var(--muted);line-height:1.45}
.oracle-grid{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.55rem}
.oracle-slot{background:var(--bg);border:1.5px solid var(--brd);border-radius:var(--r);padding:.4rem .52rem;min-width:48px;text-align:center}
.oracle-slot.best{border-color:var(--ok);background:var(--okl)}
.oracle-h{font-family:var(--mono);font-size:.58rem;color:var(--muted);margin-bottom:.14rem}
.oracle-p{font-family:var(--mono);font-size:.88rem;font-weight:700}
.oracle-tip{font-family:var(--mono);font-size:.53rem;color:var(--ok);margin-top:.12rem}
.oracle-best{font-family:var(--mono);font-size:.68rem;color:var(--ok);padding:.44rem .65rem;background:var(--okl);border:1px solid var(--okb);border-radius:var(--r);margin-top:.4rem}

/* HEATMAP */
.hm-wrap{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.85rem;margin-bottom:.85rem;overflow-x:auto}
.hm-sel{display:flex;gap:.22rem;flex-wrap:wrap;margin-bottom:.6rem}
.hm-pill{font-family:var(--mono);font-size:.6rem;padding:.18rem .56rem;border-radius:999px;border:1.5px solid var(--brd);color:var(--muted);cursor:pointer;transition:all .11s}
.hm-pill.on{background:var(--bdi);color:#fff;border-color:var(--bdi)}
.hm-lbl{font-family:var(--mono);font-size:.52rem;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:1px}
.hm-cell{height:15px;border-radius:2px}

/* WARN/INFO BOXES */
.warn-box{background:rgba(139,58,26,.06);border:1.5px solid rgba(139,58,26,.2);border-radius:var(--r);padding:.58rem .75rem;font-family:var(--mono);font-size:.69rem;color:var(--dA);margin:.6rem 0;line-height:1.45}
.info-box{background:var(--bdil);border:1.5px solid rgba(26,69,96,.18);border-radius:var(--r);padding:.58rem .75rem;font-family:var(--mono);font-size:.69rem;color:var(--bdi);margin:.6rem 0;line-height:1.45}
.debug-box{font-family:var(--mono);font-size:.59rem;color:var(--muted);background:var(--surf2);padding:.5rem .72rem;border-radius:var(--r);margin-top:.4rem;line-height:1.52;word-break:break-all}

/* API KEY MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal-overlay.hidden{display:none}
.modal-box{background:var(--bg);border-radius:var(--r2);padding:1.5rem;max-width:380px;width:100%}
.modal-box h3{font-size:1rem;font-weight:700;margin-bottom:.5rem}
.modal-box p{font-size:.8rem;color:var(--muted);line-height:1.55;margin-bottom:.85rem}
.modal-input{width:100%;background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r);padding:.55rem .7rem;font-family:var(--mono);font-size:.75rem;margin-bottom:.65rem;-webkit-appearance:none}
.modal-input:focus{outline:none;border-color:var(--swim)}
.modal-btns{display:flex;gap:.4rem;justify-content:flex-end}

.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:1rem;overflow-x:auto}
.ws-col{min-width:44px;display:flex;flex-direction:column;gap:3px}
.ws-col.ws-today{position:relative}
.ws-hdr{text-align:center;padding-bottom:4px;border-bottom:1px solid var(--brd);margin-bottom:3px}
.ws-dow{font-family:var(--mono);font-size:.49rem;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.ws-d{font-family:var(--mono);font-size:.74rem;color:var(--muted);font-weight:600;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin:0 auto;border-radius:50%}
.ws-d.ws-d-today{background:var(--swim);color:#fff}
.ws-rest{text-align:center;font-family:var(--mono);font-size:.58rem;color:var(--faint);padding:.3rem 0}
.ws-sess{border-radius:6px;padding:.3rem .28rem;cursor:pointer;transition:opacity .1s;text-align:center}
.ws-sess:active{opacity:.7}
.ws-sw{background:var(--swl);border:1.5px solid rgba(26,74,46,.2)}
.ws-drya{background:var(--dAl);border:1.5px solid rgba(139,58,26,.2)}
.ws-dryb{background:var(--dBl);border:1.5px solid rgba(26,48,96,.2)}
.ws-dryc{background:var(--dCl);border:1.5px solid rgba(90,26,110,.2)}
.ws-done{opacity:.45}
.ws-next{box-shadow:0 0 0 2px var(--next)}
.ws-past .ws-sess{opacity:.35}
.ws-badge{font-family:var(--mono);font-size:.44rem;color:var(--muted);margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-title{font-size:.62rem;font-weight:700;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ws-km{font-family:var(--mono);font-size:.52rem;color:var(--muted);margin-top:1px}


/* WEEK + WEATHER COMBINED */
.wk-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.wk-nav-title{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--ink)}
.wk-nav-btn{font-family:var(--mono);font-size:.85rem;padding:.3rem .65rem;border:1.5px solid var(--brd);border-radius:7px;color:var(--muted);cursor:pointer;background:transparent;transition:all .12s}
.wk-nav-btn:active{background:var(--surf2)}
.wk-combined{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wk-col{display:flex;flex-direction:column;align-items:center;background:var(--surf);border-radius:8px;padding:.35rem .18rem .45rem;min-height:90px;cursor:default}
.wk-col.wk-today{background:rgba(139,58,26,.06);outline:1.5px solid rgba(139,58,26,.2)}
.wk-col.wk-past{opacity:.6}
.wk-col-dow{font-family:var(--mono);font-size:.46rem;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:1px}
.wk-col-d{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.65rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.wk-col.wk-today .wk-col-d{background:var(--dA);color:#fff}
.wk-wx-icon{font-size:.92rem;line-height:1;margin-bottom:1px;min-height:.92rem}
.wk-wx-temp{font-family:var(--mono);font-size:.52rem;color:var(--muted);white-space:nowrap;min-height:.65rem}
.wk-wx-temp span{color:var(--dA)}
.wk-wx-rain{width:100%;height:2px;border-radius:1px;background:var(--brd);margin:2px 0 3px;overflow:hidden}
.wk-wx-rain-fill{height:100%;background:#1a7fa8;border-radius:1px}
.wk-sess-wrap{display:flex;flex-direction:row;justify-content:center;gap:2px;width:100%;margin-top:4px;align-items:stretch}
.wk-sess-pill{font-size:.5rem;font-weight:700;border-radius:4px;padding:3px 4px;cursor:pointer;transition:all .12s;-webkit-writing-mode:vertical-lr;writing-mode:vertical-lr;white-space:nowrap;overflow:hidden;line-height:1.3}
.wk-sess-pill:active{opacity:.7}
.wk-pill-sw{background:rgba(26,69,96,.12);color:var(--bdi)}
.wk-pill-dry{background:rgba(45,122,58,.1);color:var(--ok)}
.wk-pill-dA{background:var(--dAl);color:var(--dA)}
.wk-pill-dB{background:var(--dBl);color:var(--dB)}
.wk-pill-dC{background:var(--dCl);color:var(--dC)}
.wk-pill-done{background:var(--okl)!important;color:var(--ok)!important;opacity:.75}
.wk-rest{font-family:var(--mono);font-size:.44rem;color:var(--faint);margin-top:auto;padding-top:2px}

/* BADI CARDS NEW FORMAT */
.badi-card{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r2);padding:.85rem;position:relative;overflow:hidden;cursor:pointer;transition:all .12s}
.badi-card:active{opacity:.85}
.badi-card-bar{position:absolute;bottom:0;left:0;height:3px;transition:width .4s}
.badi-card-name{font-size:.75rem;font-weight:700;margin-bottom:.28rem;color:var(--ink)}
.badi-card-count{font-family:var(--mono);font-size:1.4rem;font-weight:700;line-height:1;margin-bottom:.08rem}
.badi-card-max{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-left:.15rem}
.badi-card-pct{font-family:var(--mono);font-size:.65rem;font-weight:700;margin-bottom:.28rem}
.badi-card-temp{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-bottom:.12rem;display:flex;align-items:center;gap:.25rem}
.badi-card-status{font-family:var(--mono);font-size:.63rem;font-weight:700;margin-top:.1rem}
.badi-letten-flow{font-family:var(--mono);font-size:.6rem;color:var(--muted);line-height:1.45}
.badi-letten-pace{font-family:var(--mono);font-size:.65rem;color:var(--bdi);font-weight:700}
.badi-status-ruhig{color:var(--ok)}.badi-status-moderat{color:#b07a00}.badi-status-stark{color:var(--dA)}

footer{text-align:center;font-family:var(--mono);font-size:.57rem;color:var(--faint);padding:1.8rem 1rem 0;border-top:1px solid var(--brd);margin-top:2.5rem}
@media(max-width:390px){:root{--pad:.9rem}}
</style>
</head>
<body>
<header class="wrap">
  <h1><strong>Bésko's</strong> <span class="h1m">Little Training Hub</span></h1>
</header>
<nav>
  <div class="tabs">
    <button class="tab on" data-tab="dash">Dashboard</button>
    <button class="tab" data-tab="badi">Badi-Tracker</button>
    <button class="tab" data-tab="swim">Schwimmen</button>
    <button class="tab" data-tab="dry">Dryland</button>
    <button class="tab" data-tab="method">Method</button>
    <button class="tab" data-tab="log">Verlauf</button>
  </div>
</nav>
<div class="modal-overlay hidden" id="api-modal">
  <div class="modal-box">
    <h3>🤖 Session Generator</h3>
    <p>Der Session Generator nutzt die Claude API. Gib deinen Anthropic API Key ein — er wird nur lokal gespeichert und nie übertragen.</p>
    <input class="modal-input" id="api-key-input" type="password" placeholder="sk-ant-...">
    <div class="modal-btns">
      <button class="btn btn-rst" onclick="document.getElementById('api-modal').classList.add('hidden')">Abbrechen</button>
      <button class="btn btn-sw" onclick="saveApiKey()">Speichern</button>
    </div>
  </div>
</div>
<main class="wrap">
  <section class="view on" data-view="dash" id="v-dash"></section>
  <section class="view" data-view="badi" id="v-badi"></section>
  <section class="view" data-view="swim" id="v-swim"></section>
  <section class="view" data-view="dry"  id="v-dry"></section>
  <section class="view" data-view="method" id="v-method"></section>
  <section class="view" data-view="log"  id="v-log"></section>
</main>

function parseTime(s){// MM:SS.xx → seconds
 if(!s||!s.includes(':'))return 0;
 const[mStr,secStr]=s.split(':');
 const m=parseInt(mStr)||0;
 const sec=parseFloat(secStr)||0;
 return m*60+sec;
}
function fmtTime(secs,decimals=0){// seconds → MM:SS or MM:SS.xx
 const m=Math.floor(secs/60);
 const s=secs%60;
 const sf=decimals>0?s.toFixed(decimals):String(Math.round(s)).padStart(2,'0');
 const sm=typeof sf==='string'?sf:String(sf);
 return `${m}:${sm.includes('.')?sm.padStart(5,'0'):sm.padStart(2,'0')}`;
}
function calcPace(css_secs,pct){return fmtTime(css_secs*85/pct);}
function getCSSpace(){
 const c=S.css();
 if(c.pace)return parseTime(c.pace);
 if(c.t400&&c.t200){const t4=parseTime(c.t400);const t2=parseTime(c.t200);if(t4>0&&t2>0)return(t4-t2)/2;}
 return 95; // default 1:35
}

let badiData={};

async function loadBadiCSV(){
 try{
  const r=await fetch(CSV_URL+'?t='+Date.now());
  if(!r.ok)throw new Error('CSV '+r.status);
  const text=await r.text();
  const rows=text.trim().split('\n');
  const hdr=rows[0].split(',');
  const data={};
  // Get last few rows per uid
  for(let i=rows.length-1;i>0;i--){
   const row=rows[i].split(',');
   const obj={};hdr.forEach((h,j)=>obj[h.trim()]=row[j]?.trim());
   const uid=obj.uid;
   if(!data[uid])data[uid]=obj;
  }
  badiData=data;
  return true;
 }catch(e){console.log('CSV fail',e);return false;}
}

function connectBadiWS(){
 if(badiWS&&badiWS.readyState<2)return;
 // Try crowdmonitor WebSocket
 try{
  badiWS=new WebSocket('wss://www.crowdmonitor.ch/api/v1/ws');
  badiWS.onmessage=e=>{try{const d=JSON.parse(e.data);updateBadiLive(d);}catch{}};
  badiWS.onerror=()=>{};
  badiWS.onclose=()=>{setTimeout(connectBadiWS,30000);};
 }catch{}
}

function buildBadiCard(t){
 const live=BADI_STATE?.live?.[t.key];
 const letten=LETTEN_DATA||{};
 if(t.isLetten){
  const wtemp=letten.temp!==undefined?letten.temp.toFixed(1)+'°C':'—';
  const flow=letten.flow!==undefined?letten.flow.toFixed(1)+' m³/s':'—';
  const speed=letten.speed!==undefined?letten.speed.toFixed(2)+' m/s':'—';
  const pace=letten.speed!==undefined?formatLettenPace(letten.speed):'—';
  const statusC=letten.speed===undefined?'bst-x':letten.speed<0.5?'badi-status-ruhig':letten.speed<1.2?'badi-status-moderat':'badi-status-stark';
  const statusT=letten.speed===undefined?'—':letten.speed<0.5?'🟢 ruhig':letten.speed<1.2?'🟡 moderat':'🔴 stark';
  return`<div class="badi-card" onclick="switchTab('badi')">
   <div class="badi-card-name">${t.name}</div>
   <div class="badi-card-count" style="color:var(--bdi)">${wtemp}</div>
   <div class="badi-letten-flow">Limmat · ${flow} · ${speed}</div>
   <div class="badi-letten-pace">△ ${pace}/100m</div>
   <div class="badi-card-status ${statusC}">${statusT} <span style="font-weight:400;color:var(--faint)">(Schätzung)</span></div>
  </div>`;
 }
 if(!live)return`<div class="badi-card" onclick="switchTab('badi')">
  <div class="badi-card-name">${t.name}</div>
  <div class="badi-card-count" style="color:var(--faint)">—</div>
  <div class="badi-card-pct bst-x">Verbinde…</div>
 </div>`;
 const fill=parseInt(live.currentfill)||0;
 const max=parseInt(live.maxspace)||100;
 const ratio=fill/max;
 const pct=Math.round(ratio*100);
 const col=ratio2color(ratio);
 const lbl=ratio2label(ratio);
 const temp=POOL_TEMPS[t.key]?`🌡 ${POOL_TEMPS[t.key]}`:'';
 return`<div class="badi-card" onclick="switchTab('badi')">
  <div class="badi-card-bar" style="width:${Math.min(pct,100)}%;background:${col}"></div>
  <div class="badi-card-name">${t.name}</div>
  <div style="display:flex;align-items:baseline;gap:.18rem">
   <span class="badi-card-count" style="color:${col}">${fill}</span>
   <span class="badi-card-max">/ ${max}</span>
  </div>
  <div class="badi-card-pct ${lbl.c}">${pct}% · ${lbl.t}</div>
  ${temp?`<div class="badi-card-temp">🌡 <span>${POOL_TEMPS[t.key]}</span></div>`:''}
 </div>`;
}

function formatLettenPace(speedMs){
 // Rough estimate: add flow_speed as pace penalty upstream
 const penaltySec=speedMs*45; // empirical: 1 m/s ≈ 45 sec/100m penalty
 const total=Math.round(penaltySec);
 const m=Math.floor(total/60);const s=total%60;
 return`+${m}:${String(s).padStart(2,'0')}`;
}

async function loadWeatherWeek(){
 try{
  // Open-Meteo (MeteoSwiss station data, free, no key)
  const url='https://api.open-meteo.com/v1/forecast?latitude=47.3769&longitude=8.5417'
   +'&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunshine_duration'
   +'&current_weather=true&timezone=Europe%2FZurich&forecast_days=14';
  const r=await fetch(url);const d=await r.json();
  const dates=d.daily.time;
  WEEK_WX={};
  dates.forEach((ds,i)=>{
   WEEK_WX[ds]={
    code:d.daily.weathercode[i],
    max:d.daily.temperature_2m_max[i],
    min:d.daily.temperature_2m_min[i],
    rain:d.daily.precipitation_probability_max[i]||0,
    sun:Math.round((d.daily.sunshine_duration[i]||0)/3600*10)/10,
    icon:wmoIcon(d.daily.weathercode[i])
   };
  });
  // Current weather strip
  if(d.current_weather){
   const c=d.current_weather;
   const wxEl=el('wx-strip');
   if(wxEl){const icon=wmoIcon(c.weathercode);
    wxEl.innerHTML=`<span class="wx-icon">${icon}</span><div><div class="wx-main">${Math.round(c.temperature)}°C</div><div class="wx-sub">${wmoDesc(c.weathercode)} · ${Math.round(c.windspeed)} km/h</div></div><div class="wx-right">Zürich<br>${new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})}</div>`;
   }
  }

  const wcEl=el('v-dash')?.querySelector('.wk-combined');
  if(wcEl)updateWeekWxCols();
 }catch(e){console.log('Weather fail:',e.message);}

 loadLettenData();
}

function wmoIcon(code){
 if(code===0)return'☀️';if(code<=2)return'🌤️';if(code===3)return'☁️';

 if(code<=77)return'🌨️';if(code<=82)return'🌦️';if(code<=86)return'🌨️';
 return'⛈️';
}
function wmoDesc(code){
 if(code===0)return'Klar';if(code<=2)return'Leicht bewölkt';if(code===3)return'Bewölkt';
 if(code<=48)return'Nebel';if(code<=55)return'Nieselregen';if(code<=67)return'Regen';
 if(code<=77)return'Schnee';if(code<=82)return'Schauer';return'Gewitter';
}

async function loadLettenData(){
 try{
  // BAFU hydro station 2099 = Limmat Letten via existenz.ch proxy
  const r=await fetch('https://api.existenz.ch/apiv1/hydro/latest?parameters=flow,temperature&station=2099&app=besko-training-hub');
  if(!r.ok)throw new Error('BAFU '+r.status);
  const d=await r.json();
  const payload=d.payload||[];
  payload.forEach(p=>{
   if(p.par==='flow'||p.par==='AbflussPneumatik')LETTEN_DATA.flow=parseFloat(p.val);
   if(p.par==='temperature'||p.par==='Temperatur')LETTEN_DATA.temp=parseFloat(p.val);
  });
  // Estimate speed: Limmat at Letten cross-section ≈ 80m²
  if(LETTEN_DATA.flow)LETTEN_DATA.speed=LETTEN_DATA.flow/80;
  // Refresh dashboard
  const card=el('dash-badi-4');if(card)refreshBadiCards();
 }catch(e){console.log('Letten fail:',e.message);}
}

async function loadPoolTemps(){
 try{
  const r=await fetch('https://raw.githubusercontent.com/derbsq/Badi-Tracker/main/data/temperatures.json?nc='+Date.now());
  if(!r.ok)return;
  const d=await r.json();
  if(d.city?.temp!=null)POOL_TEMPS.city=d.city.temp+'°C';
  if(d.letzigraben?.temp!=null)POOL_TEMPS.letzigraben=d.letzigraben.temp+'°C';
  if(d.utoquai?.temp!=null)POOL_TEMPS.utoquai=d.utoquai.temp+'°C';
  if(d.letten?.water_temp!=null&&!LETTEN_DATA.temp)LETTEN_DATA.temp=d.letten.water_temp;

 }catch(e){console.log('Pool temps fail:',e.message);}
}

async function parsePDF(){

 const file=inp.files[0];

 el('pdf-result').innerHTML='';
 try{
  const base64=await new Promise((res,rej)=>{
   const r=new FileReader();
   r.onload=()=>res(r.result.split(',')[1]);
   r.onerror=()=>rej(new Error('Read failed'));
   r.readAsDataURL(file);
  });
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
   method:'POST',

function badiConnectWS(){
  if(BADI_STATE.wsTimer){clearTimeout(BADI_STATE.wsTimer);BADI_STATE.wsTimer=null;}
  if(BADI_STATE.ws&&BADI_STATE.ws.readyState<2){BADI_STATE.ws.close();}
  const statusEl=document.getElementById('badi-ws-status');
  if(statusEl)statusEl.textContent='Verbinde…';
  let ws;
  try{ws=new WebSocket(BADI_WS_URL);}
  catch(e){if(statusEl)statusEl.textContent='WS nicht verfügbar';return;}
  BADI_STATE.ws=ws;
  ws.onopen=()=>{
    ws.send('1 all');
    if(statusEl)statusEl.textContent='🟢 Live';
  };
  ws.onmessage=(msg)=>{
    try{
      const arr=JSON.parse(msg.data);
      if(!Array.isArray(arr))return;
      BADI_TARGETS.forEach(t=>{
        const e=arr.find(x=>t.match.some(m=>(x.name||'').toLowerCase().includes(m)));
        if(e)BADI_STATE.live[t.key]=e;
      });
      badiRenderLiveCards();
      refreshBadiCards();
      if(statusEl){
        const now=new Date();
        statusEl.textContent='🟢 Live · '+now.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
      }
    }catch{}
  };
  ws.onerror=()=>{if(statusEl)statusEl.textContent='⚠️ Verbindungsfehler';};
  ws.onclose=()=>{
    if(statusEl)statusEl.textContent='🔴 Getrennt';
    BADI_STATE.wsTimer=setTimeout(badiConnectWS,20000);
  };
}

// ─── CSV loading ─────────────────────────────────────────────
function badiParseCSV(text){
  const lines=text.replace(/\r/g,'').trim().split('\n').filter(l=>l.trim());
  if(lines.length<2)return[];
  const sep=lines[0].includes('\t')?'\t':',';
  const hdrs=lines[0].split(sep).map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const vals=line.split(sep);
    const row={};
    hdrs.forEach((h,i)=>row[h]=(vals[i]||'').trim());
    return row;
  }).filter(r=>r.uid&&r.timestamp_local);
}

async function badiLoadData(){
  const statusEl=document.getElementById('badi-hist-status');
  if(statusEl)statusEl.textContent='Lade historische Daten…';
  try{
    const r=await fetch(BADI_CSV_URL,{cache:'no-store'});
    if(r.ok){
      const text=await r.text();
      BADI_STATE.history=badiParseCSV(text);
      if(statusEl)statusEl.textContent=BADI_STATE.history.length+' Datenpunkte';
      badiRenderCurrentView();
    }else throw new Error('CSV '+r.status);
  }catch(e){
    if(statusEl)statusEl.textContent='Keine historischen Daten';
    console.log('Badi CSV fail:',e.message);
  }
  // Load bahnen
  try{
    const r=await fetch(BADI_BASE+'bahnen_city.json',{cache:'no-store'});
    if(r.ok)BADI_STATE.bahnen=await r.json();
  }catch{}
  try{
    const r=await fetch(BADI_BASE+'vario_city.json',{cache:'no-store'});
    if(r.ok)BADI_STATE.vario=await r.json();
  }catch{}
  if(BADI_STATE.bahnen||BADI_STATE.vario)badiRenderLanes();
}

// ─── Heatmap ─────────────────────────────────────────────────
function badiRenderHeatmap(){
  const canvas=document.getElementById('badi-chart-canvas');
  if(!canvas)return;
  const data=badiFilteredData();
  const DAY_MAP={Monday:0,Tuesday:1,Wednesday:2,Thursday:3,Friday:4,Saturday:5,Sunday:6};
  const DAY_LABELS=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const HOURS=Array.from({length:16},(_,i)=>i+6);
  const buckets={};
  data.forEach(r=>{
    const d=DAY_MAP[r.weekday];
    const h=parseInt(r.hour);
    const ratio=parseFloat(r.fill_ratio);
    if(d===undefined||isNaN(h)||isNaN(ratio))return;
    const k=d+'_'+h;
    if(!buckets[k]){buckets[k]={sum:0,count:0};}
    buckets[k].sum+=ratio;buckets[k].count++;
  });
  // Draw on canvas
  const W=canvas.parentElement.offsetWidth-32||300;
  const CELL_W=Math.max((W-30)/HOURS.length,16);
  const CELL_H=22;
  canvas.width=W;
  canvas.height=DAY_LABELS.length*CELL_H+28;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // Today highlight
  const todayDow=(new Date().getDay()+6)%7;
  // Draw cells
  DAY_LABELS.forEach((dl,di)=>{
    ctx.fillStyle=di===todayDow?'rgba(26,74,46,.08)':'transparent';
    ctx.fillRect(30,di*CELL_H,W-30,CELL_H);
    ctx.fillStyle=di===todayDow?'#1a4a2e':'#aaa49d';
    ctx.font=(di===todayDow?'bold ':'')+`10px DM Mono,monospace`;
    ctx.fillText(dl,2,di*CELL_H+CELL_H-5);
    HOURS.forEach((h,hi)=>{
      const b=buckets[di+'_'+h];
      const ratio=b?b.sum/b.count:null;
      ctx.fillStyle=ratio!==null?ratio2color(ratio):'#ede9e0';
      ctx.fillRect(30+hi*CELL_W,di*CELL_H+1,CELL_W-1,CELL_H-2);
      if(b&&b.count>0){
        ctx.fillStyle='rgba(255,255,255,.7)';
        ctx.font='8px DM Mono,monospace';
        ctx.fillText(Math.round(ratio*100)+'%',30+hi*CELL_W+2,di*CELL_H+CELL_H-5);
      }
    });
  });
  // Hour labels
  ctx.fillStyle='#aaa49d';ctx.font='9px DM Mono,monospace';
  HOURS.forEach((h,hi)=>{if(h%2===0)ctx.fillText(h+'h',30+hi*CELL_W,DAY_LABELS.length*CELL_H+14);});
  // Info
  const info=document.getElementById('badi-chart-info');
  if(info)info.textContent=data.length>0?`${data.length} Datenpunkte · ${BADI_TARGETS.find(t=>t.key===BADI_STATE.selBad)?.label||''}`:'Noch keine historischen Daten für diese Ansicht.';
}

// ─── Oracle / Bésmeralda ──────────────────────────────────────
function badiRenderOracle(){
  const wrap=document.getElementById('badi-oracle-content');
  if(!wrap)return;
  const data=BADI_STATE.history;
  const t=BADI_TARGETS.find(t=>t.key===BADI_STATE.selBad)||BADI_TARGETS[0];
  const uid=t.uid;
  const isOutdoor=uid!=='SSD-4';

  const offset=BADI_STATE.oracleDay;
  const predDate=new Date();predDate.setDate(predDate.getDate()+offset);
  const todayStr=predDate.toISOString().slice(0,10);
  const todayDow=predDate.getDay();
  const DAY_EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const todayKey=DAY_EN[todayDow];
  const isWeekend=todayDow===0||todayDow===6;
  const isHoliday=isBadiHoliday(todayStr);
  const isSchool=isSchoolHol(todayStr);
  const tempC=null;const rainMm=0;

  const W_WEEKDAY=isOutdoor?0.38:0.48;
  const W_HOLIDAY=0.22;const W_SCHOOL=0.14;
  const W_TEMP=isOutdoor?0.16:0.06;const W_RAIN=isOutdoor?0.10:0.04;

  const allDays={};
  data.filter(r=>r.uid===uid).forEach(r=>{
    const d=(r.timestamp_local||'').slice(0,10);
    if(!d)return;
    if(!allDays[d])allDays[d]={weekday:r.weekday,holiday:r.is_holiday==='True',school:r.is_school_holiday==='True',hours:{}};
    const h=parseInt(r.hour);const ratio=parseFloat(r.fill_ratio);
    if(!isNaN(h)&&!isNaN(ratio)){
      if(!allDays[d].hours[h])allDays[d].hours[h]=[];
      allDays[d].hours[h].push(ratio);
    }
  });

  const scored=Object.entries(allDays).map(([date,day])=>{
    let sw=0;
    if(isHoliday){sw=(day.holiday||day.weekday==='Sunday')?1.0:0.2;}
    else{sw=day.weekday===todayKey?1.0:(["Saturday","Sunday"].includes(day.weekday)===isWeekend)?0.4:0.1;}
    const sh=(day.holiday===isHoliday)?1.0:0.2;
    const ss=(day.school===isSchool)?1.0:0.3;
    const similarity=W_WEEKDAY*sw+W_HOLIDAY*sh+W_SCHOOL*ss+W_TEMP*0.5+W_RAIN*0.8;
    const daysDiff=Math.max(0,(new Date(todayStr)-new Date(date))/86400000);
    const recency=Math.exp(-daysDiff*0.023);
    const score=0.70*similarity+0.30*recency;
    return{date,day,score,daysDiff};
  }).filter(d=>d.date!==todayStr&&d.daysDiff>0).sort((a,b)=>b.score-a.score);

  const top=scored.slice(0,20);
  const HOURS=Array.from({length:16},(_,i)=>i+6);
  const predictions=HOURS.map(h=>{
    let wSum=0,wValSum=0,n=0;
    top.forEach(item=>{
      const vals=item.day.hours[h];
      if(!vals||!vals.length)return;
      const mean=vals.reduce((s,v)=>s+v,0)/vals.length;
      wSum+=item.score;wValSum+=item.score*mean;n++;
    });
    if(n===0)return{h,pct:null};
    let factor=1.0;
    if(!isOutdoor&&tempC!==null){if(tempC>25)factor=0.7;else if(tempC<10)factor=0.75;}
    return{h,pct:Math.min(100,Math.round((wValSum/wSum)*100*factor))};
  });

  const nowH=new Date().getHours();
  const upcoming=predictions.filter(p=>p.h>=nowH&&p.h<=nowH+8);
  const bestSlot=upcoming.reduce((b,p)=>p.pct!==null&&(b===null||p.pct<b.pct)?p:b,null);

  const BARNUM=[
    'Ich spüre, dass Sie in letzter Zeit eine große Veränderung in sich tragen. Das Wasser wird sie klären.',
    'Die Sterne zeigen: Sie sind jemand, der mehr gibt als er nimmt — auch auf der Bahn.',
    'Das Pendel schlägt deutlich aus: Heute ist ein Tag der Entscheidungen. Treffen Sie die richtige.',
    'Ich sehe: Sie haben in jüngster Zeit Ihre Routine hinterfragt. Die Antwort liegt im Wasser.',
    'Wer ruhige Bahnen sucht, soll ruhige Zeiten wählen. Die Kugel zeigt dir, wann das ist.',
    'Die Energie des heutigen Tages ist komplex. Früh gehen ist Weisheit, nicht Schwäche.'
  ];
  const barnumMsg=BARNUM[Math.floor((new Date().getDate()+offset)%BARNUM.length)];

  const DAY_LABEL_DE=['Heute','Morgen','Übermorgen'];
  const dayLabel=offset<3?DAY_LABEL_DE[offset]:`In ${offset} Tagen`;
  const DOW_DE=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

  let oracleHtml=`<div style="display:flex;gap:.3rem;margin-bottom:.65rem">
    ${[-0,1,2].map(i=>`<button class="hm-pill${BADI_STATE.oracleDay===i?' on':''}" onclick="BADI_STATE.oracleDay=${i};badiRenderOracle()">${i===0?'Heute':i===1?'Morgen':'Übermorgen'}</button>`).join('')}
  </div>
  <div style="font-family:var(--mono);font-size:.67rem;color:var(--swim);margin-bottom:.65rem">
    ${dayLabel} · ${DOW_DE[predDate.getDay()]}${isHoliday?' · 🎉 '+HOLIDAYS_2026[todayStr]:''}${isSchool?' · 🏖 Schulferien':''}
  </div>`;

  // Prediction slots
  oracleHtml+='<div style="display:flex;gap:.28rem;flex-wrap:wrap;margin-bottom:.65rem">';
  upcoming.slice(0,8).forEach(p=>{
    const isBest=bestSlot&&p.h===bestSlot.h;
    const col=p.pct!==null?ratio2color(p.pct/100):'#aaa';
    oracleHtml+=`<div style="border:1.5px solid ${isBest?'var(--ok)':'var(--brd)'};background:${isBest?'var(--okl)':'var(--bg)'};border-radius:8px;padding:.38rem .48rem;text-align:center;min-width:44px">
      <div style="font-family:var(--mono);font-size:.57rem;color:var(--muted)">${p.h}:00</div>
      <div style="font-family:var(--mono);font-size:.88rem;font-weight:700;color:${col}">${p.pct!==null?p.pct+'%':'–'}</div>
      ${isBest?'<div style="font-family:var(--mono);font-size:.5rem;color:var(--ok)">★ Best</div>':''}
    </div>`;
  });
  oracleHtml+='</div>';

  if(bestSlot&&bestSlot.pct!==null){
    oracleHtml+=`<div style="background:var(--okl);border:1px solid var(--okb);border-radius:var(--r);padding:.5rem .7rem;font-family:var(--mono);font-size:.7rem;color:var(--ok);margin-bottom:.55rem">★ Bester Zeitpunkt heute: ${bestSlot.h}:00 Uhr · ca. ${bestSlot.pct}% Belegung</div>`;
  }
  oracleHtml+=`<div style="font-family:var(--mono);font-size:.68rem;color:var(--muted);line-height:1.55;font-style:italic;border-left:2px solid var(--brd);padding-left:.6rem;margin-top:.25rem">${barnumMsg}</div>`;
  oracleHtml+=`<details style="margin-top:.65rem"><summary style="font-family:var(--mono);font-size:.6rem;color:var(--faint);cursor:pointer">Algorithmus</summary><div style="font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-top:.4rem;line-height:1.52">kNN mit exponentieller Recency-Gewichtung.<br>Score = 0.70 × Ähnlichkeit + 0.30 × e^(−0.023 × Tage)<br>Halbwertszeit ≈ 30 Tage · Top-20 ähnlichste Tage</div></details>`;

  wrap.innerHTML=oracleHtml;
  if(top.length===0)wrap.innerHTML=`<div class="info-box">Noch zu wenig historische Daten für Vorhersagen. Bésmeralda braucht mindestens 2 Wochen.</div>`;
}

// ─── LOG VIEW ────────────────────────────────────────────────
function renderLog(){
 const v=el('v-log');
 const logs=S.logs();
 const entries=[];
 Object.entries(logs).sort((a,b)=>b[0]<a[0]?-1:1).forEach(([date,sess])=>{
  Object.entries(sess).forEach(([sid,data])=>{
   const s=SWIM.find(x=>x.id===sid);
   const label=s?s.title:sid.replace('dry-','Dryland ');
   entries.push({date,sid,label,data});
  });
 });
 if(!entries.length){v.innerHTML='<div class="empty">Noch keine Sessions eingetragen</div>';return;}
 v.innerHTML=`<div class="sl first">TRAININGSLOG</div>`+entries.map(e=>`<div class="hist-e"><div class="he-hd"><span class="he-t">${e.label}</span><span class="he-d">${fmtDateFull(e.date)}</span></div>${e.data.notes?`<div class="he-s">${e.data.notes}</div>`:''}</div>`).join('');
}

// ─── NAVIGATION ──────────────────────────────────────────────
function switchTab(tab){
 document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',t.dataset.tab===tab);});
 document.querySelectorAll('.view').forEach(v=>{v.classList.toggle('on',v.dataset.view===tab);});
 const renders={dash:renderDash,badi:renderBadi,swim:renderSwim,dry:renderDry,method:renderMethod,log:renderLog};
 if(renders[tab])renders[tab]();
 window.scrollTo(0,0);
}

// ── DASH DRY TOGGLE ─────────────────────────────────────────
function normalizeWeekPills(){
 const pills=document.querySelectorAll('.wk-sess-pill');
 let max=0;
 pills.forEach(p=>{max=Math.max(max,p.scrollHeight);});
 pills.forEach(p=>{p.style.height=max+'px';});
}

function dashToggleDry(id,ds,btn){
 const key='dry-'+id;
 const was=S.isLogged(ds,key);
 if(was){const l=S.logs();if(l[ds])delete l[ds][key];S.set('hub_logs',l);}
 else S.savelog(ds,key,'','');
 const now=S.isLogged(ds,key);
 if(btn){
  const dr=DRY[id];
  const dtitle=dr?dr.title:('Dry '+id);
  btn.className='wk-sess-pill '+(now?'wk-pill-done':'wk-pill-dry');
  btn.textContent=(now?'✓ ':'')+dtitle;
 }
}

// ── BADI CSV QUICK LOAD ─────────────────────────────────────
async function loadBadiCSVForDash(){
 try{
  const r=await fetch('https://raw.githubusercontent.com/derbsq/Badi-Tracker/main/data/auslastung.csv?nc='+Date.now(),{cache:'no-store'});
  if(!r.ok)return;
  const txt=await r.text();
  const lines=txt.trim().split('\n');if(lines.length<2)return;
  const hdrs=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  const latest={};
  for(let i=lines.length-1;i>0;i--){
   const vals=lines[i].split(',');
   const row={};hdrs.forEach((h,j)=>row[h]=(vals[j]||'').trim().replace(/^"|"$/g,''));
   if(row.uid&&!latest[row.uid])latest[row.uid]=row;
  }
  BADI_DASH.forEach(t=>{
   const row=latest[t.uid];if(!row)return;
   const fill=parseFloat(row.fill||row.currentfill||row.belegung||0);
   const max=parseFloat(row.max||row.maxspace||row.kapazitaet||220);
   BADI_STATE.live[t.key]={currentfill:Math.round(fill),maxspace:Math.round(max),name:t.name};
  });
  refreshBadiCards();
 }catch(e){console.log('Badi CSV:',e.message);}
}

 c.innerHTML=BADI_DASH.map(t=>buildBadiCard(t)).join('');
}

// ── UPDATE WEEK WEATHER COLUMNS ─────────────────────────────
function updateWeekWxCols(){
 // Update week column icons
 document.querySelectorAll('.wk-col[data-ds]').forEach(col=>{
  const ds=col.dataset.ds;const wx=WEEK_WX[ds];if(!wx)return;
  const icon=col.querySelector('.wk-wx-icon');
  const temp=col.querySelector('.wk-wx-temp');
  const rain=col.querySelector('.wk-wx-rain-fill');
  if(icon)icon.textContent=wx.icon;
  if(temp)temp.innerHTML='<span>'+Math.round(wx.max)+'°</span> '+Math.round(wx.min)+'°';
  if(rain)rain.style.width=wx.rain+'%';
 });
 // Update weather card strip
 const tw=WEEK_WX[TODAY_STR];
 if(!tw)return;
 // Use querySelector as fallback since IDs may not exist after re-render
 const setEl=(id,val,html)=>{const e=document.getElementById(id);if(e){if(html)e.innerHTML=val;else e.textContent=val;}};
 setEl('wx-icon-el',tw.icon,false);
 setEl('wx-main-text',Math.round(tw.max)+'°C',false);
 setEl('wx-sub-text',wmoDesc(tw.code||0)+' · '+Math.round(tw.min)+'–'+Math.round(tw.max)+'°',false);
 setEl('wx-right-text','Zürich<br>'+new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}),true);
 // Build 7-day strip
 const strip=document.getElementById('wx-7day');
 if(!strip)return;
 const DOW=['So','Mo','Di','Mi','Do','Fr','Sa'];
 const days=Object.entries(WEEK_WX).filter(([d])=>d>=TODAY_STR).sort((a,b)=>a[0]<b[0]?-1:1).slice(0,7);
 strip.innerHTML=days.map(([ds,wx])=>{
  const d=new Date(ds+'T12:00:00');const isT=ds===TODAY_STR;
  const rainPct=Math.round(wx.rain||0);
  const sunOp=Math.min(1,(wx.sun||0)/8).toFixed(2);
  return '<div style="background:'+(isT?'var(--swl)':'var(--bg)')+';border-radius:6px;padding:4px 2px;text-align:center;border:1px solid '+(isT?'rgba(26,74,46,.25)':'var(--brd)')+'">'+
   '<div style="font-family:var(--mono);font-size:.44rem;color:var(--faint);text-transform:uppercase">'+(isT?'Heute':DOW[d.getDay()])+'</div>'+
   '<div style="font-size:.88rem">'+(wx.icon||'–')+'</div>'+
   '<div style="font-family:var(--mono);font-size:.5rem;color:var(--dA);font-weight:700">'+Math.round(wx.max)+'°</div>'+
   '<div style="font-family:var(--mono);font-size:.44rem;color:var(--faint)">'+Math.round(wx.min)+'°</div>'+
   '<div style="height:3px;border-radius:2px;background:#1a7fa8;margin:2px 0;opacity:'+(rainPct/100).toFixed(2)+'"></div>'+
   '<div style="height:3px;border-radius:2px;background:#c49a00;opacity:'+sunOp+'"></div>'+
  '</div>';
 }).join('');
}
